name: Build Knulli Docker Image

on:
  workflow_call:
    inputs:
      OWNER_LC:
        type: string
        required: true
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'Dockerfile'
      - '.dockerignore'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute owner_lc
        id: lc
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists on GHCR
        id: check
        run: |
          IMAGE="ghcr.io/${{ inputs.OWNER_LC || steps.lc.outputs.OWNER_LC }}/knulli-build:latest"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "이미지 이미 존재 — 빌드 스킵: $IMAGE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "이미지 없음 — 빌드 필요: $IMAGE"
          fi

      - name: Build and push
        # ✅ FIX: workflow_call 로 호출될 때는 github.event_name 이 원래 트리거를
        #         상속하므로 (e.g. workflow_dispatch), 매번 강제 재빌드가 발생했음.
        #         이미지가 이미 존재하면 push/workflow_dispatch 에서만 재빌드.
        #         workflow_call 경유 시(배치 빌드)는 이미지 없을 때만 빌드.
        if: |
          steps.check.outputs.exists != 'true' ||
          github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context:    .
          file:       Dockerfile
          push:       true
          tags: |
            ghcr.io/${{ inputs.OWNER_LC || steps.lc.outputs.OWNER_LC }}/knulli-build:latest
          cache-from: type=registry,ref=ghcr.io/${{ inputs.OWNER_LC || steps.lc.outputs.OWNER_LC }}/knulli-build:buildcache
          cache-to:   type=registry,ref=ghcr.io/${{ inputs.OWNER_LC || steps.lc.outputs.OWNER_LC }}/knulli-build:buildcache,mode=max
