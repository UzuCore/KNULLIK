          fi
          rm -f ${PREFIX}* ccache.tar

      - name: Normalize ccache permissions
        run: |
          # Docker/Buildroot may access this directory with a different UID than
          # the GitHub runner. Restored archives can otherwise make ccache fail
          # with: "ccache: error: Permission denied".
          mkdir -p buildroot-ccache
          sudo chown -R "$(id -u):$(id -g)" buildroot-ccache || true
          sudo chmod -R a+rwX buildroot-ccache || true
          echo "buildroot-ccache: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          ls -ld buildroot-ccache

      - uses: actions/download-artifact@v4
        with:
          name: base-${{ inputs.BOARD }}

      - name: Extract base
        run: |
          tar --zstd -xf base.tar.zst
          rm base.tar.zst

      # ✅ 보드 .config 에서 실제로 선택된 Qt6 / EmulationStation 패키지만 빌드
      #    knulli-system 은 knulli-emulationstation 을, batocera-system 은 batocera-emulationstation 을 선택한다.
      - name: Detect frontend packages enabled for this board
        id: fe-list
        run: |
          if [ ! -f output/${BOARD}/.config ]; then
            make ${BOARD}-config BATCH_MODE=1
          fi
          PKGS=""
          for P in qt6base knulli-emulationstation batocera-emulationstation; do
            VAR="BR2_PACKAGE_$(echo $P | tr 'a-z-' 'A-Z_')"
            if grep -q "^${VAR}=y" output/${BOARD}/.config 2>/dev/null; then
              PKGS="$PKGS $P"
            fi
          done
          PKGS="${PKGS# }"
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          if [ -z "$PKGS" ]; then
            echo "::warning::이 보드는 활성화된 Qt6/EmulationStation 패키지가 없습니다 — 빈 잡으로 통과"
          else
            echo "빌드 대상: $PKGS"
          fi

      - name: Build Qt6 + EmulationStation
        if: ${{ steps.fe-list.outputs.packages != '' }}
        timeout-minutes: 290
        env:
          PKGS: ${{ steps.fe-list.outputs.packages }}
        run: bash .github/workflows/run-build.sh 3-frontend $PKGS

      - name: Print disk space
        if: always()
        run: df -h


      - name: Show Buildroot dl size
        if: always()
        run: du -sh "$DL_DIR" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-frontend
          path: |
            build.log
            build-attempt*.log
          if-no-files-found: ignore
          include-hidden-files: true

      # 빌드가 실패하거나 시간 초과로 멈춰도 그때까지 쌓인 ccache 는 저장해 재실행 시간을 줄인다.
      - name: Trim and save ccache
        if: success() || failure()
        run: |
          # 시간 초과로 멈춘 스텝의 빌드 컨테이너가 남아 있으면 먼저 멈춘다.
          docker ps -q | xargs -r docker kill > /dev/null 2>&1 || true
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
