name: Build Knulli

on:
  workflow_dispatch:
    inputs:
      h700:
        description: 'h700'
        type: boolean
        default: false
      rk3326:
        description: 'rk3326'
        type: boolean
        default: false
      rk3568:
        description: 'rk3568'
        type: boolean
        default: false
      a133:
        description: 'a133'
        type: boolean
        default: false
      rk3399:
        description: 'rk3399'
        type: boolean
        default: false
      rk3566:
        description: 'rk3566'
        type: boolean
        default: false
      rk3576:
        description: 'rk3576'
        type: boolean
        default: false
      rk3588:
        description: 'rk3588'
        type: boolean
        default: false
      release:
        description: 'official release (uncheck for nightly)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-envs:
    runs-on: ubuntu-24.04
    outputs:
      OWNER_LC: ${{ steps.envs.outputs.OWNER_LC }}
      matrix: ${{ steps.generate.outputs.matrix }}
      DATE: ${{ steps.envs.outputs.DATE }}
      RELEASE_TYPE: ${{ steps.envs.outputs.RELEASE_TYPE }}
    steps:
      - id: envs
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          echo "DATE=$(TZ=Asia/Seoul date +'%Y%m%d')" >> $GITHUB_OUTPUT
          if [ "${{ inputs.release }}" = "true" ]; then
            echo "RELEASE_TYPE=stable" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TYPE=nightly" >> $GITHUB_OUTPUT
          fi

      - id: generate
        shell: bash
        run: |
          declare -A BOARDS=(
            ["h700"]="${{ inputs.h700 }}"
            ["rk3326"]="${{ inputs.rk3326 }}"
            ["rk3568"]="${{ inputs.rk3568 }}"
            ["a133"]="${{ inputs.a133 }}"
            ["rk3399"]="${{ inputs.rk3399 }}"
            ["rk3566"]="${{ inputs.rk3566 }}"
            ["rk3576"]="${{ inputs.rk3576 }}"
            ["rk3588"]="${{ inputs.rk3588 }}"
          )
          SELECTED=""
          for B in "${!BOARDS[@]}"; do
            if [[ "${BOARDS[$B]}" == "true" ]]; then
              [[ -n "$SELECTED" ]] && SELECTED="$SELECTED,"
              SELECTED="$SELECTED{\"board\":\"$B\"}"
            fi
          done
          if [[ -z "$SELECTED" ]]; then
            echo "::error::보드를 하나 이상 선택하세요"
            exit 1
          fi
          echo "matrix=[$SELECTED]" >> $GITHUB_OUTPUT

  build-docker:
    needs: set-envs
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}

  build-boards:
    name: ${{ matrix.board }}
    needs: [set-envs, build-docker]
    if: ${{ needs.build-docker.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-envs.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/build-board.yml
    secrets: inherit
    with:
      BOARD: ${{ matrix.board }}
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}
      DATE: ${{ needs.set-envs.outputs.DATE }}

  rerun-failed:
    needs: build-boards
    if: |
      always() && !cancelled() &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) &&
      fromJSON(github.run_attempt) < 3
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }}

  release:
    needs: [set-envs, build-boards]
    if: ${{ always() && !cancelled() && needs.build-boards.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: knulli-image-*
          merge-multiple: true
          path: ./release

      - id: verify
        run: |
          if ls ./release/*.img.gz >/dev/null 2>&1; then
            echo "has_images=true" >> $GITHUB_OUTPUT
            ls -la ./release/
          else
            echo "::warning::업로드할 이미지가 없습니다"
            echo "has_images=false" >> $GITHUB_OUTPUT
          fi

      - uses: ncipollo/release-action@v1.14.0
        if: ${{ steps.verify.outputs.has_images == 'true' }}
        with:
          tag: ${{ needs.set-envs.outputs.DATE }}
          name: Knulli ${{ needs.set-envs.outputs.DATE }}
          artifacts: "./release/*"
          allowUpdates: true
          makeLatest: ${{ needs.set-envs.outputs.RELEASE_TYPE == 'stable' }}
          prerelease: ${{ needs.set-envs.outputs.RELEASE_TYPE == 'nightly' }}
          token: ${{ secrets.GITHUB_TOKEN }}
