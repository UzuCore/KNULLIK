name: Build Board (Parallel Staged)

# ─────────────────────────────────────────────────────────────────────────────
# 빌드 그래프:
#
#   check ──→ toolchain ──→ base ──→ frontend ──┬──→ heavy-libretro(+libretro-mame) ┐
#                                      ├──→ libretro-rest                 ├──→ build/final image
#                                      ├──→ standalone                    ┤
#                                      └──→ standalone-heavy              ┘
#
# ✅ 핵심: 병렬 잡은 그 잡에서 새로 빌드한 패키지(의존 패키지 포함)의
#    build/ + per-package/ + .stamp_* 를 묶어 올림.
#    image 잡에서 모두 merge한 뒤 make 한 번 더 돌려 최종 이미지.
#
# ✅ libretro-rest job 추가:
#    image/build 단계에서 잔여 libretro 코어를 대량 빌드하면 6시간 제한에 걸릴 수 있음.
#    → heavy-libretro / libretro-rest / standalone 을 frontend 이후 병렬화하고,
#      마지막 build 단계는 merge + 잔여 패키지 + final image 생성에 집중.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      BOARD:
        type: string
        required: true
      OWNER_LC:
        type: string
        required: true
      DATE:
        type: string
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BOARD:      ${{ inputs.BOARD }}
  CACHE_REPO: ${{ vars.CACHE_REPO || 'knulli-build-cache' }}
  # Knulli Makefile uses DL_DIR and mounts it into Docker as /build/buildroot/dl.
  # dl is intentionally not cached: local dl can be very large, so ccache remains the main accelerator.
  # BR2_DL_DIR is kept for direct-build compatibility.
  DL_DIR:     ${{ github.workspace }}/dl
  BR2_DL_DIR: ${{ github.workspace }}/dl
  # 소스는 미러(update-mirror-sources.yml 이 채움) → 원래 주소 → sources.buildroot.net 순서로 받는다.
  # Makefile 의 %-config 가 EXTRA_OPTS 를 defconfig 에 덧붙인다.
  EXTRA_OPTS: BR2_PRIMARY_SITE=\"https://github.com/${{ github.repository_owner }}/${{ vars.SOURCES_REPO || 'knulli-build-sources' }}/releases/download/sources\"
  # ccache 총량 제한. GitHub release asset 1개 한도는 split(1900m)으로 피하고,
  # ccache 자체는 stage별 빌드 비용에 맞춰 충분히 크게 유지한다.
  CCACHE_MAX_TOOLCHAIN:      "1G"
  CCACHE_MAX_BASE:           "2G"
  CCACHE_MAX_FRONTEND:       "3G"
  CCACHE_MAX_HEAVY_LIBRETRO: "8G"
  CCACHE_MAX_LIBRETRO:       "8G"
  CCACHE_MAX_STANDALONE:     "6G"
  CCACHE_MAX_BUILD:          "5G"
  # 무거운 패키지의 단계 배정은 여기서만 관리한다. 나머지 libretro 코어는 자동 감지한다.
  HEAVY_LIBRETRO_PACKAGES: >-
    libretro-parallel-n64 libretro-mupen64plus-next
    libretro-flycast libretro-beetle-saturn libretro-beetle-psx
    libretro-ppsspp libretro-melonds libretro-desmume libretro-dolphin
    libretro-swanstation libretro-mame libretro-mame2003-plus libretro-mame2010
  STANDALONE_PACKAGES: >-
    dolphin-emu ppsspp duckstation melonds pcsx2 flycast vita3k
    yabasanshiro m8c sdl2_drastic advanced_drastic easyrpg-player gsplus hatari simcoupe
    x16emu lexaloffle-pico8 openbor4432 openbor6412 openbor7142 openbor7530
  STANDALONE_HEAVY_PACKAGES: >-
    scummvm dosbox-staging dosbox-x vice solarus-engine thextech amiberry lightspark
    moonlight-embedded mupen64plus-core mupen64plus-audio-sdl mupen64plus-input-sdl
    mupen64plus-rsp-hle mupen64plus-ui-console mupen64plus-video-glide64mk2 mupen64plus-video-rice
  # ✅ FIX: ccache 환경변수 (ROCKNIX 동일) — 이게 없으면 cache hit rate 급락
  DISABLE_COLORS:        "yes"
  CCACHE_COMPILERCHECK:  content
  CCACHE_COMPRESS:       "1"
  CCACHE_COMPRESSLEVEL:  "6"
  CCACHE_SLOPPINESS:     pch_defines,time_macros,include_file_mtime,include_file_ctime

jobs:

  # 설정/다운로드 오류를 컴파일 전에 발견한다. 별도 대형 빌드 볼륨이나 ccache 는 필요 없다.
  check:
    name: ${{ inputs.BOARD }} · 0-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run build script regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/workflows/test-build-scripts.py -v

      - name: Prepare docker and download directory
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available
          mkdir -p "$DL_DIR"

      - name: Generate and validate board configuration
        shell: bash
        run: |
          make "${BOARD}-config" BATCH_MODE=1 PARALLEL_BUILD=1 2>&1 | tee config-check.log
          # 현재 커밋의 릴리즈 태그는 제외해 이전 릴리즈 이후 변경을 점검한다.
          BASE_REF=$(git tag --sort=-refname --merged HEAD | { grep -E '^[0-9]{8}$' || true; } | while read -r tag; do
            if [ "$(git rev-list -n1 "$tag")" != "$(git rev-parse HEAD)" ]; then echo "$tag"; break; fi
          done)
          python3 .github/workflows/preflight-check.py config --board "$BOARD" --base-ref "$BASE_REF"

      - name: List selected package sources
        shell: bash
        run: |
          make "${BOARD}-build" BATCH_MODE=1 PARALLEL_BUILD=1 CMD=show-info 2>&1 | tee show-info.raw
          python3 .github/workflows/preflight-check.py floating --board "$BOARD" --show-info show-info.raw

      - name: Check missing mirror sources
        env:
          GH_TOKEN: ${{ secrets.CACHE_PAT || github.token }}
        run: |
          REPO="${GITHUB_REPOSITORY_OWNER}/${{ vars.SOURCES_REPO || 'knulli-build-sources' }}"
          RID=$(gh api "repos/$REPO/releases/tags/sources" --jq .id)
          gh api --paginate "repos/$REPO/releases/$RID/assets?per_page=100" --jq '.[].name' > mirror-assets.txt
          python3 .github/workflows/preflight-check.py sources --show-info show-info.raw --assets mirror-assets.txt --out missing-sources.tsv

      - name: Validate downloads absent from the mirror
        shell: bash
        timeout-minutes: 40
        run: |
          [ -s missing-sources.tsv ] || exit 0
          PKGS=$(cut -f1 missing-sources.tsv | LC_ALL=C sort -u | sed 's/$/-source/' | tr '\n' ' ')
          OK=0
          for i in 1 2; do
            # -k 로 한 패키지가 실패해도 나머지 소스의 오류를 함께 찾는다.
            if make "${BOARD}-build" BATCH_MODE=1 PARALLEL_BUILD=1 MAKE_OPTS=-k "CMD=$PKGS" \
                2>&1 | tee "source-check-attempt${i}.log"; then
              OK=1; break
            fi
            [ "$i" -eq 2 ] || sleep 60
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error title=${BOARD} · 사전 다운로드 실패::source-check 로그에서 다운로드 주소/해시 오류를 확인하세요."
            exit 1
          fi

      - name: Add validated sources to mirror without replacing existing files
        env:
          GH_TOKEN: ${{ secrets.CACHE_PAT }}
        shell: bash
        run: |
          [ -s missing-sources.tsv ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CACHE_PAT 가 없어 새 소스를 미러에 올리지 않습니다. 빌드는 원래 주소를 사용합니다."
            exit 0
          fi
          REPO="${GITHUB_REPOSITORY_OWNER}/${{ vars.SOURCES_REPO || 'knulli-build-sources' }}"
          BAD=0
          while IFS=$'\t' read -r pkg subdir file; do
              # hidapi and python-hidapi use the same filename for different sources.
              if grep -Fxq "$file" .github/mirror-excluded-sources.txt; then
                echo "::notice::미러 파일명 충돌로 원래 주소를 사용: $file ($pkg)"
                continue
              fi
            path="$DL_DIR/$subdir/$file"
            if [ ! -f "$path" ] || [ "$(stat -c %s "$path")" -ge 2147483648 ]; then
              echo "::warning::미러 업로드 건너뜀: $file (파일 없음 또는 2 GiB 이상)"
              continue
            fi
            # 해시 파일이 없는 패키지는 다운로드 서버의 HTML 안내 페이지도 통과하므로 형식을 확인한다.
            case "$file" in
              *.tar.*|*.tgz|*.tbz2|*.txz|*.zip|*.gz|*.bz2|*.xz|*.zst|*.lz)
                if file -b --mime-type "$path" | grep -q '^text/'; then
                  echo "::error title=${BOARD} · 잘못된 다운로드::$pkg: $file 이 압축 파일이 아닙니다 ($(file -b "$path" | cut -c1-60)). 다운로드 주소와 .hash 를 확인하세요."
                  BAD=1
                  continue
                fi
                ;;
            esac
            # 동시에 다른 보드가 같은 파일을 올려도 기존 파일은 덮어쓰지 않는다.
            gh release upload sources "$path" --repo "$REPO" </dev/null \
              || echo "::warning::미러 업로드 실패 또는 이미 있는 파일: $file"
          done < missing-sources.tsv
          exit "$BAD"

      - name: Upload preflight logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-check
          path: |
            config-check.log
            show-info.raw
            mirror-assets.txt
            missing-sources.tsv
            source-check-attempt*.log
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 1: toolchain (모든 잡의 기반)
  # ═════════════════════════════════════════════════════════════════════════
  toolchain:
    name: ${{ inputs.BOARD }} · 1-toolchain
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      actions:  write
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: H700 batocera-configgen quick workaround
        if: ${{ inputs.BOARD == 'h700' }}
        run: |
          # Temporary fork-local workaround:
          # The current batocera submodule lacks an H700 BATOCERA_CONFIGGEN_SYSTEM mapping.
          # That makes batocera-configgen look for configgen-defaults-.yml during build.
          # Reuse Knulli's H700 defaults under that fallback filename until upstream fixes it.
          install -D -m 0644 \
            package/system/knulli-configgen/configs/configgen-defaults-h700.yml \
            batocera/package/batocera/core/batocera-configgen/configs/configgen-defaults-.yml

      - name: Prepare Buildroot dl dir
        run: mkdir -p "$DL_DIR"

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-toolchain.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar --no-same-owner --no-same-permissions -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - name: Normalize ccache permissions
        run: |
          # Docker/Buildroot may access this directory with a different UID than
          # the GitHub runner. Restored archives can otherwise make ccache fail
          # with: "ccache: error: Permission denied".
          mkdir -p buildroot-ccache
          sudo chown -R "$(id -u):$(id -g)" buildroot-ccache || true
          sudo chmod -R a+rwX buildroot-ccache || true
          echo "buildroot-ccache: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          ls -ld buildroot-ccache

      - name: Build toolchain
        timeout-minutes: 290
        run: bash .github/workflows/run-build.sh 1-toolchain toolchain

      - name: Print disk space
        if: always()
        run: df -h


      - name: Show Buildroot dl size
        if: always()
        run: du -sh "$DL_DIR" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-toolchain
          path: |
            build.log
            build-attempt*.log
            output/${{ inputs.BOARD }}/build/*/.stamp_built
          if-no-files-found: ignore
          include-hidden-files: true

      # 빌드가 실패하거나 시간 초과로 멈춰도 그때까지 쌓인 ccache 는 저장해 재실행 시간을 줄인다.
      - name: Trim and save ccache
        if: success() || failure()
        run: |
          # 시간 초과로 멈춘 스텝의 빌드 컨테이너가 남아 있으면 먼저 멈춘다.
          docker ps -q | xargs -r docker kill > /dev/null 2>&1 || true
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if [ -d "$CCACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR" || true
            sudo chmod -R a+rwX "$CCACHE_DIR" || true
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M "$CCACHE_MAX_TOOLCHAIN" || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-toolchain.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-toolchain.tar.part-*
        continue-on-error: true

      - name: Save ccache (toolchain)
        id: save-cache-toolchain
        uses: ncipollo/release-action@v1.14.0
        if: ${{ !cancelled() && hashFiles(format('ccache-{0}-toolchain.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-toolchain.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (toolchain)
        if: ${{ !cancelled() && steps.save-cache-toolchain.outcome == 'failure' }}
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 toolchain ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      - name: Compress output
        run: |
          echo "=== output/${BOARD}/ 실제 내용 ==="
          ls -la "output/${BOARD}/" 2>/dev/null || { echo "::error::..."; exit 1; }
          shopt -s nullglob; STAMPS=( output/${BOARD}/.stamp_* ); shopt -u nullglob
          PATHS=()
          for P in host build staging per-package .config; do
            [ -e "output/${BOARD}/$P" ] && PATHS+=( "output/${BOARD}/$P" )
          done
          PATHS+=( "${STAMPS[@]}" )
          [ ${#PATHS[@]} -eq 0 ] && { echo "::error::..."; exit 1; }
          tar --zstd -cf toolchain.tar.zst "${PATHS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name:              toolchain-${{ inputs.BOARD }}
          path:              toolchain.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 2a: base (linux 커널) — toolchain 직후
  # ═════════════════════════════════════════════════════════════════════════
  base:
    name: ${{ inputs.BOARD }} · 2-base (linux)
    needs: toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: H700 batocera-configgen quick workaround
        if: ${{ inputs.BOARD == 'h700' }}
        run: |
          # Temporary fork-local workaround:
          # The current batocera submodule lacks an H700 BATOCERA_CONFIGGEN_SYSTEM mapping.
          # That makes batocera-configgen look for configgen-defaults-.yml during build.
          # Reuse Knulli's H700 defaults under that fallback filename until upstream fixes it.
          install -D -m 0644 \
            package/system/knulli-configgen/configs/configgen-defaults-h700.yml \
            batocera/package/batocera/core/batocera-configgen/configs/configgen-defaults-.yml

      - name: Prepare Buildroot dl dir
        run: mkdir -p "$DL_DIR"

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-base.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar --no-same-owner --no-same-permissions -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - name: Normalize ccache permissions
        run: |
          # Docker/Buildroot may access this directory with a different UID than
          # the GitHub runner. Restored archives can otherwise make ccache fail
          # with: "ccache: error: Permission denied".
          mkdir -p buildroot-ccache
          sudo chown -R "$(id -u):$(id -g)" buildroot-ccache || true
          sudo chmod -R a+rwX buildroot-ccache || true
          echo "buildroot-ccache: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          ls -ld buildroot-ccache

      - uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ inputs.BOARD }}

      - name: Extract toolchain
        run: |
          tar --zstd -xf toolchain.tar.zst
          rm toolchain.tar.zst

      # ✅ 보드 .config 에서 uboot 사용 여부 감지 (모든 보드가 uboot를 쓰지는 않음 — 예: sm8250)
      #    %-build 가 의존성으로 %-config 를 부르므로 .config 생성을 위해 이 호출이 필요.
      #    `CMD=':'` 같은 트릭 대신 명시적 %-config 타겟을 사용한다.
      - name: Generate .config and detect base packages
        id: base-list
        run: |
          make ${BOARD}-config BATCH_MODE=1
          PKGS="linux"
          if grep -q "^BR2_TARGET_UBOOT=y" output/${BOARD}/.config 2>/dev/null; then
            PKGS="$PKGS uboot"
          fi
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          echo "빌드 대상: $PKGS"

      - name: Build base packages
        timeout-minutes: 290
        env:
          PKGS: ${{ steps.base-list.outputs.packages }}
        run: bash .github/workflows/run-build.sh 2-base $PKGS

      - name: Print disk space
        if: always()
        run: df -h


      - name: Show Buildroot dl size
        if: always()
        run: du -sh "$DL_DIR" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-base
          path: |
            build.log
            build-attempt*.log
          if-no-files-found: ignore
          include-hidden-files: true

      # 빌드가 실패하거나 시간 초과로 멈춰도 그때까지 쌓인 ccache 는 저장해 재실행 시간을 줄인다.
      - name: Trim and save ccache
        if: success() || failure()
        run: |
          # 시간 초과로 멈춘 스텝의 빌드 컨테이너가 남아 있으면 먼저 멈춘다.
          docker ps -q | xargs -r docker kill > /dev/null 2>&1 || true
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if [ -d "$CCACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR" || true
            sudo chmod -R a+rwX "$CCACHE_DIR" || true
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M "$CCACHE_MAX_BASE" || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-base.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-base.tar.part-*
        continue-on-error: true

      - name: Save ccache (base)
        id: save-cache-base
        uses: ncipollo/release-action@v1.14.0
        if: ${{ !cancelled() && hashFiles(format('ccache-{0}-base.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-base.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (base)
        if: ${{ !cancelled() && steps.save-cache-base.outcome == 'failure' }}
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 base ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      - name: Compress output
        run: tar --zstd -cf base.tar.zst output/${BOARD}/

      - uses: actions/upload-artifact@v4
        with:
          name:              base-${{ inputs.BOARD }}
          path:              base.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  frontend:
    name: ${{ inputs.BOARD }} · 3-frontend
    needs: base
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: H700 batocera-configgen quick workaround
        if: ${{ inputs.BOARD == 'h700' }}
        run: |
          # Temporary fork-local workaround:
          # The current batocera submodule lacks an H700 BATOCERA_CONFIGGEN_SYSTEM mapping.
          # That makes batocera-configgen look for configgen-defaults-.yml during build.
          # Reuse Knulli's H700 defaults under that fallback filename until upstream fixes it.
          install -D -m 0644 \
            package/system/knulli-configgen/configs/configgen-defaults-h700.yml \
            batocera/package/batocera/core/batocera-configgen/configs/configgen-defaults-.yml

      - name: Prepare Buildroot dl dir
        run: mkdir -p "$DL_DIR"

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-frontend.tar.part-"
