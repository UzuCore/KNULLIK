name: Build Knulli

on:
  workflow_dispatch:
    inputs:
      # ── Allwinner ──────────────────────────────────────────────────────────
      h700:
        description: 'h700 (Anbernic RG28XX/RG34XX/RG34XX-SP/RG35XX-PRO/RG35XX PLUS/RG35XX H/RG35XX SP/RG40XX H/RG40XX V/RGCubeXX)'
        type: boolean
        default: false
      a133:
        description: 'a133 (TrimUI Smart Pro/Brick·Hammer, Powkiddy V90S/V20)'
        type: boolean
        default: false
      # ── Rockchip ───────────────────────────────────────────────────────────
      rk3128:
        description: 'rk3128 (Powkiddy A12/A13, PS5000, PS7000)'
        type: boolean
        default: false
      rk3326:
        description: 'rk3326 (R36S, BATLEXP G350, MAGICX Mini M, GKD Pixel2)'
        type: boolean
        default: false
      # ── 릴리즈 옵션 ────────────────────────────────────────────────────────
      release_type:
        description: '릴리즈 타입'
        type: choice
        default: 'nightly'
        options:
          - nightly
          - stable
          - draft

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-envs:
    runs-on: ubuntu-24.04
    outputs:
      OWNER_LC: ${{ steps.envs.outputs.OWNER_LC }}
      matrix:   ${{ steps.generate.outputs.matrix }}
      DATE:     ${{ steps.envs.outputs.DATE }}
    steps:
      - name: Set env
        id: envs
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          echo "DATE=$(TZ=Asia/Seoul date +'%Y%m%d')"  >> $GITHUB_OUTPUT

      - name: Generate board matrix
        id: generate
        shell: bash
        run: |
          declare -A BOARDS=(
            ["h700"]="${{ inputs.h700 }}"
            ["a133"]="${{ inputs.a133 }}"
            ["rk3128"]="${{ inputs.rk3128 }}"
            ["rk3326"]="${{ inputs.rk3326 }}"
          )
          SELECTED=""
          for B in "${!BOARDS[@]}"; do
            if [[ "${BOARDS[$B]}" == "true" ]]; then
              [[ -n "$SELECTED" ]] && SELECTED="$SELECTED,"
              SELECTED="${SELECTED}{\"board\":\"$B\"}"
            fi
          done
          if [[ -z "$SELECTED" ]]; then
            echo "::error::보드를 하나 이상 선택하세요"
            exit 1
          fi
          echo "matrix=[$SELECTED]" >> $GITHUB_OUTPUT

  build-docker:
    needs: set-envs
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}

  build-boards:
    name: build-${{ matrix.board }}
    needs:
      - set-envs
      - build-docker
    if: ${{ needs.build-docker.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-envs.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/build-board.yml
    secrets: inherit
    with:
      BOARD:    ${{ matrix.board }}
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}
      DATE:     ${{ needs.set-envs.outputs.DATE }}

  rerun-failed:
    needs: build-boards
    if: |
      always() && !cancelled() &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) &&
      fromJSON(github.run_attempt) < 3
    runs-on: ubuntu-24.04
    # ✅ FIX (issue 2): gh workflow run 호출은 actions: write 권한 필수.
    #     전역 permissions 에는 actions 항목이 없어 상속만으로는 부족했음.
    permissions:
      actions:  write
      contents: read
    steps:
      - env:
          GH_REPO:  ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }}

  release:
    needs:
      - set-envs
      - build-boards
    if: ${{ always() && !cancelled() && needs.build-boards.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: knulli-image-*
          merge-multiple: true
          path: ./release

      - name: Verify artifacts exist
        id: verify
        run: |
          if ls ./release/*.img.gz >/dev/null 2>&1; then
            echo "has_images=true" >> $GITHUB_OUTPUT
            ls -la ./release/
          else
            echo "::warning::업로드할 이미지가 없습니다"
            echo "has_images=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        if: ${{ steps.verify.outputs.has_images == 'true' }}
        run: |
          git fetch --tags
          CURRENT="${{ needs.set-envs.outputs.DATE }}"
          # ✅ FIX: ccache 같은 비-릴리즈 태그를 제외하고 YYYYMMDD 태그만 추출
          #         (이전 버전은 ccache 태그가 createdate 정렬에서 앞에 와서
          #          changelog 가 조용히 깨졌음)
          PREV=$(git tag --sort=-creatordate | grep -E '^[0-9]{8}$' | grep -vx "$CURRENT" | head -n 1 || true)
          if [ -z "$PREV" ]; then
            COMMITS=$(git log --pretty=format:"- %h %s (%an)" | grep -v "Merge branch" | head -n 50 || true)
          else
            COMMITS=$(git log "${PREV}..HEAD" --pretty=format:"- %h %s (%an)" | grep -v "Merge branch" || true)
          fi
          {
            echo "## 변경사항"; echo ""
            [ -z "$COMMITS" ] && echo "- 변경된 커밋 없음" || echo "$COMMITS"
            echo ""; echo "## 빌드된 이미지"; echo ""
            ls ./release/*.img.gz 2>/dev/null | xargs -n1 basename | sed 's/^/- /' || echo "- (없음)"
          } > release_notes.md

      - uses: ncipollo/release-action@v1.14.0
        if: ${{ steps.verify.outputs.has_images == 'true' }}
        with:
          tag:          ${{ needs.set-envs.outputs.DATE }}
          name:         Knulli ${{ needs.set-envs.outputs.DATE }}
          artifacts:    "./release/*"
          allowUpdates: true
          makeLatest:   ${{ inputs.release_type == 'stable' }}
          prerelease:   ${{ inputs.release_type == 'nightly' }}
          draft:        ${{ inputs.release_type == 'draft' }}
          bodyFile:     release_notes.md
          token:        ${{ secrets.GITHUB_TOKEN }}
