name: Build Knulli Docker Image

on:
  workflow_call:
    inputs:
      OWNER_LC:
        type: string
        required: true
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'Dockerfile'
      - '.dockerignore'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute owner_lc
        id: lc
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists on GHCR
        id: check
        run: |
          IMAGE="ghcr.io/${{ inputs.OWNER_LC || steps.lc.outputs.OWNER_LC }}/knulli-build:latest"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "이미지 이미 존재 — 빌드 스킵: $IMAGE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "이미지 없음 — 빌드 필요: $IMAGE"
          fi

      - name: Build and push
        # 의도:
        # - 이미지가 없으면 빌드
        # - Dockerfile/.dockerignore push 때는 강제 재빌드
        # - build.yml에서 workflow_call로 호출된 일반 배치 빌드에서는 이미지가 있으면 스킵
        #
        # 주의:
        # workflow_dispatch 조건을 여기에 넣으면 build.yml 수동 실행 경유에서도
        # Docker 이미지가 매번 재빌드될 수 있으므로 넣지 않는다.
        if: |
          steps.check.outputs.exists != 'true' ||
          github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context:    .
          file:       Dockerfile
          push:       true
          tags: |
            ghcr.io/${{ inputs.OWNER_LC || steps.lc.outputs.OWNER_LC }}/knulli-build:latest
          cache-from: type=registry,ref=ghcr.io/${{ inputs.OWNER_LC || steps.lc.outputs.OWNER_LC }}/knulli-build:buildcache
          cache-to:   type=registry,ref=ghcr.io/${{ inputs.OWNER_LC || steps.lc.outputs.OWNER_LC }}/knulli-build:buildcache,mode=max
