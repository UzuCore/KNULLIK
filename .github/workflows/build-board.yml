name: Build Board

on:
  workflow_call:
    inputs:
      BOARD:    { type: string, required: true }
      OWNER_LC: { type: string, required: true }
      DATE:     { type: string, required: true }

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  toolchain:
    name: ${{ inputs.BOARD }} · 1-toolchain
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      BOARD: ${{ inputs.BOARD }}
      CACHE_REPO: ${{ vars.CACHE_REPO || 'knulli-build-cache' }}
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 6144
          swap-size-mb: 8192
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 1 }

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache/ccache-${{ inputs.BOARD }}-toolchain.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xf - || echo "ccache 없음 — 첫 빌드"

      - name: Build toolchain
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          max_attempts: 6
          retry_interval: 10
          command: |
            set -e
            { make ${BOARD}-build CMD='toolchain' BATCH_MODE=1 PARALLEL_BUILD=1; \
              echo $? > docker_exit_code; } \
              | tee output.log \
              | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            exit_code=$(<docker_exit_code)
            exit $exit_code

      - name: Archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-toolchain
          path: |
            output.log
            output/${{ inputs.BOARD }}/build/*/.stamp_built
          if-no-files-found: ignore

      - name: Save ccache
        run: |
          CCACHE_DIR="output/${BOARD}/host/var/cache/ccache"
          if [ -d "$CCACHE_DIR" ]; then
            tar --remove-files -cf ccache-${BOARD}-toolchain.tar "$CCACHE_DIR"
          fi
        continue-on-error: true

      - uses: ncipollo/release-action@v1.14.0
        if: ${{ hashFiles(format('ccache-{0}-toolchain.tar', inputs.BOARD)) != '' }}
        with:
          tag: ccache
          artifacts: ccache-${{ inputs.BOARD }}-toolchain.tar
          allowUpdates: true
          makeLatest: false
          prerelease: true
          body: ccache
          token: ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          repo: ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Compress directory
        run: |
          tar --zstd -cf toolchain.tar.zst \
            output/${BOARD}/host \
            output/${BOARD}/build \
            output/${BOARD}/staging \
            output/${BOARD}/per-package \
            output/${BOARD}/.config \
            output/${BOARD}/.stamp_* 2>/dev/null || \
          tar --zstd -cf toolchain.tar.zst output/${BOARD}/

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ inputs.BOARD }}
          path: toolchain.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  base:
    name: ${{ inputs.BOARD }} · 2-base
    needs: toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      BOARD: ${{ inputs.BOARD }}
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 6144
          swap-size-mb: 8192
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 1 }

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ inputs.BOARD }}

      - name: Extract toolchain
        run: |
          tar --zstd -xf toolchain.tar.zst
          rm toolchain.tar.zst

      - name: Build base (linux + busybox)
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          max_attempts: 6
          retry_interval: 10
          command: |
            set -e
            { make ${BOARD}-build CMD='linux busybox' BATCH_MODE=1 PARALLEL_BUILD=1; \
              echo $? > docker_exit_code; } \
              | tee output.log \
              | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            exit_code=$(<docker_exit_code)
            exit $exit_code

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-base
          path: output.log
          if-no-files-found: ignore

      - name: Compress directory
        run: |
          tar --zstd -cf base.tar.zst output/${BOARD}/

      - uses: actions/upload-artifact@v4
        with:
          name: base-${{ inputs.BOARD }}
          path: base.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: ${{ inputs.BOARD }} · 3-frontend
    needs: base
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      BOARD: ${{ inputs.BOARD }}
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 6144
          swap-size-mb: 8192
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 1 }

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - uses: actions/download-artifact@v4
        with:
          name: base-${{ inputs.BOARD }}

      - name: Extract base
        run: |
          tar --zstd -xf base.tar.zst
          rm base.tar.zst

      - name: Build frontend (qt6 + emulationstation)
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          max_attempts: 6
          retry_interval: 10
          command: |
            set -e
            { make ${BOARD}-build CMD='qt6base batocera-emulationstation' BATCH_MODE=1 PARALLEL_BUILD=1; \
              echo $? > docker_exit_code; } \
              | tee output.log \
              | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            exit_code=$(<docker_exit_code)
            exit $exit_code

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-frontend
          path: output.log
          if-no-files-found: ignore

      - name: Compress directory
        run: |
          tar --zstd -cf frontend.tar.zst output/${BOARD}/

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}
          path: frontend.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  retroarch:
    name: ${{ inputs.BOARD }} · 4-retroarch
    needs: frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      BOARD: ${{ inputs.BOARD }}
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 6144
          swap-size-mb: 8192
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 1 }

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}

      - name: Extract frontend
        run: |
          tar --zstd -xf frontend.tar.zst
          rm frontend.tar.zst

      - name: Build retroarch + cores
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          max_attempts: 6
          retry_interval: 10
          command: |
            set -e
            { make ${BOARD}-build CMD='retroarch' BATCH_MODE=1 PARALLEL_BUILD=1; \
              echo $? > docker_exit_code; } \
              | tee output.log \
              | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            exit_code=$(<docker_exit_code)
            exit $exit_code

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-retroarch
          path: output.log
          if-no-files-found: ignore

      - name: Compress directory
        run: |
          tar --zstd -cf retroarch.tar.zst output/${BOARD}/

      - uses: actions/upload-artifact@v4
        with:
          name: retroarch-${{ inputs.BOARD }}
          path: retroarch.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  image:
    name: ${{ inputs.BOARD }} · 5-image
    needs: retroarch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      BOARD: ${{ inputs.BOARD }}
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 6144
          swap-size-mb: 8192
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 1 }

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - uses: actions/download-artifact@v4
        with:
          name: retroarch-${{ inputs.BOARD }}

      - name: Extract retroarch
        run: |
          tar --zstd -xf retroarch.tar.zst
          rm retroarch.tar.zst

      - name: Build everything + final image
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          max_attempts: 6
          retry_interval: 10
          command: |
            set -e
            { make ${BOARD}-build BATCH_MODE=1 PARALLEL_BUILD=1; \
              echo $? > docker_exit_code; } \
              | tee output.log \
              | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            exit_code=$(<docker_exit_code)
            exit $exit_code

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-image
          path: output.log
          if-no-files-found: ignore

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: knulli-image-${{ inputs.BOARD }}-${{ inputs.DATE }}
          path: |
            output/${{ inputs.BOARD }}/images/knulli/images/${{ inputs.BOARD }}/knulli-*.img.gz
            output/${{ inputs.BOARD }}/images/knulli/images/${{ inputs.BOARD }}/knulli-*.img.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
