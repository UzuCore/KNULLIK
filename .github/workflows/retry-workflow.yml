name: Retry workflow

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Wait for run ${{ inputs.run_id }} to finish
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id 는 숫자여야 합니다"; exit 1; }
          echo "run $RUN_ID 완료 대기 중..."
          gh run watch "$RUN_ID" > /dev/null 2>&1 || true

      - name: Rerun failed jobs in ${{ inputs.run_id }}
        shell: bash
        run: |
          META=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '[.conclusion, (.run_attempt | tostring)] | @tsv')
          IFS=$'\t' read -r STATUS ATTEMPT <<< "$META"
          echo "최종 상태: $STATUS (시도 $ATTEMPT)"
          if [ "$STATUS" = success ] || [ "$STATUS" = cancelled ] || [ "$ATTEMPT" -ge 3 ]; then
            echo "::notice::성공/사용자 취소/재시도 한도 — 재실행하지 않음"
            exit 0
          fi
          # job.id 와 check_run.id 는 다르다. 응답의 check_run_url 을 그대로 쓴다.
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | [.id, (.check_run_url // "")] | @tsv' > failed-jobs.tsv
          INFRA_RE='lost communication|received a shutdown signal|stopped hearing from|not acquired by Runner'
          RETRY=0; BLOCKED=0
          while IFS=$'\t' read -r JOB CHECK_URL; do
            MSG=""
            if [[ "$CHECK_URL" == https://api.github.com/repos/"$GH_REPO"/check-runs/* ]]; then
              CHECK_PATH="${CHECK_URL#https://api.github.com/}"
              MSG=$(gh api --paginate "$CHECK_PATH/annotations?per_page=100" --jq '.[].message' 2>/dev/null || true)
            fi
            if grep -qiE "$INFRA_RE" <<< "$MSG"; then
              echo "job $JOB: 러너 문제 — 재실행 대상"
              RETRY=1
            else
              echo "job $JOB: 빌드 오류/시간 초과/원인 불명 — 자동 재실행 안 함"
              BLOCKED=1
            fi
          done < failed-jobs.tsv
          # --failed 는 모든 실패 잡을 돌리므로, 실제 빌드 오류가 함께 있으면 자동 재실행하지 않는다.
          if [ "$RETRY" -eq 0 ] || [ "$BLOCKED" -ne 0 ]; then
            echo "::notice::모든 실패가 러너 문제인 경우에만 자동 재실행합니다"
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed
