name: Build Board (Parallel Staged)

# ─────────────────────────────────────────────────────────────────────────────
# 빌드 그래프:
#
#   toolchain ──┬──→ base ──→ frontend ──┬──→ heavy-libretro ──┐
#               │                          │                      ├──→ image
#               │                          └──→ standalone ──────┤
#               └──→ mame-lr ──────────────────────────────────┘
#
# ✅ ROCKNIX 방식: 병렬 잡은 자기가 만든 결과물(per-package + images + .stamp_*)
#    만 묶어 올림. image 잡에서 모두 merge한 뒤 make 한 번 더 돌려 최종 이미지.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      BOARD:
        type: string
        required: true
      OWNER_LC:
        type: string
        required: true
      DATE:
        type: string
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BOARD:      ${{ inputs.BOARD }}
  CACHE_REPO: ${{ vars.CACHE_REPO || 'knulli-build-cache' }}
  # ✅ FIX: ccache 환경변수 (ROCKNIX 동일) — 이게 없으면 cache hit rate 급락
  DISABLE_COLORS:        "yes"
  CCACHE_COMPILERCHECK:  content
  CCACHE_COMPRESS:       "1"
  CCACHE_COMPRESSLEVEL:  "6"
  CCACHE_SLOPPINESS:     pch_defines,time_macros,include_file_mtime,include_file_ctime

jobs:

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 1: toolchain (모든 잡의 기반)
  # ═════════════════════════════════════════════════════════════════════════
  toolchain:
    name: ${{ inputs.BOARD }} · 1-toolchain
    runs-on: ubuntu-24.04
    permissions:
      actions:  write
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-toolchain.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - name: Build toolchain
        shell: bash
        run: |
          # ✅ FIX: actions-retry-command was wrapping the whole command in
          #         result=$(...) which buffers every byte until the command
          #         exits. Long builds (mame, qt, libretro) appeared frozen.
          #         Inline retry loop so output streams in real time.
          set +e
          RC=0
          for i in 1 2 3 4 5 6; do
            echo "::group::Attempt $i"
            make ${BOARD}-build CMD='toolchain' BATCH_MODE=1 PARALLEL_BUILD=1 \
              2>&1 | tee build.log | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            RC=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ $RC -eq 0 ] && exit 0
            echo "Attempt $i failed (RC=$RC), sleeping 10s before retry..."
            sleep 10
          done
          exit $RC

      - name: Print disk space
        if: always()
        run: df -h

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-toolchain
          path: |
            build.log
            output/${{ inputs.BOARD }}/build/*/.stamp_built
          if-no-files-found: ignore

      - name: Trim and save ccache
        if: success()
        run: |
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M 500M || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-toolchain.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-toolchain.tar.part-*
        continue-on-error: true

      - name: Save ccache (toolchain)
        id: save-cache-toolchain
        uses: ncipollo/release-action@v1.14.0
        if: ${{ hashFiles(format('ccache-{0}-toolchain.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-toolchain.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (toolchain)
        if: steps.save-cache-toolchain.outcome == 'failure'
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 toolchain ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      - name: Compress output
        run: |
          echo "=== output/${BOARD}/ 실제 내용 ==="
          ls -la "output/${BOARD}/" 2>/dev/null || { echo "::error::..."; exit 1; }
          shopt -s nullglob; STAMPS=( output/${BOARD}/.stamp_* ); shopt -u nullglob
          PATHS=()
          for P in host build staging per-package .config; do
            [ -e "output/${BOARD}/$P" ] && PATHS+=( "output/${BOARD}/$P" )
          done
          PATHS+=( "${STAMPS[@]}" )
          [ ${#PATHS[@]} -eq 0 ] && { echo "::error::..."; exit 1; }
          tar --zstd -cf toolchain.tar.zst "${PATHS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name:              toolchain-${{ inputs.BOARD }}
          path:              toolchain.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 2a: base (linux 커널) — toolchain 직후
  # ═════════════════════════════════════════════════════════════════════════
  base:
    name: ${{ inputs.BOARD }} · 2-base (linux)
    needs: toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-base.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ inputs.BOARD }}

      - name: Extract toolchain
        run: |
          tar --zstd -xf toolchain.tar.zst
          rm toolchain.tar.zst

      # ✅ B 패턴: 마지막 release 태그 이후 변경된 패키지의 stamp 제거
      #    SCOPE_PATTERNS 환경변수로 이 잡이 책임지는 패키지 패턴 지정
      - name: Auto-detect and clean changed packages
        env:
          # base 잡: 커널/부트로더 계열만
          SCOPE_PATTERNS: "linux* uboot* *bootloader* *kernel*"
        run: |
          bash .github/workflows/clean-changed-packages.sh

      # ✅ 보드 .config 에서 uboot 사용 여부 감지 (모든 보드가 uboot를 쓰지는 않음 — 예: sm8250)
      #    %-build 가 의존성으로 %-config 를 부르므로 .config 생성을 위해 이 호출이 필요.
      #    `CMD=':'` 같은 트릭 대신 명시적 %-config 타겟을 사용한다.
      - name: Generate .config and detect base packages
        id: base-list
        run: |
          make ${BOARD}-config BATCH_MODE=1
          PKGS="linux"
          if grep -q "^BR2_TARGET_UBOOT=y" output/${BOARD}/.config 2>/dev/null; then
            PKGS="$PKGS uboot"
          fi
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          echo "빌드 대상: $PKGS"

      - name: Build base packages
        shell: bash
        run: |
          # ✅ FIX: actions-retry-command was wrapping the whole command in
          #         result=$(...) which buffers every byte until the command
          #         exits. Long builds (mame, qt, libretro) appeared frozen.
          #         Inline retry loop so output streams in real time.
          set +e
          RC=0
          for i in 1 2 3 4 5 6; do
            echo "::group::Attempt $i"
            make ${BOARD}-build CMD='${{ steps.base-list.outputs.packages }}' BATCH_MODE=1 PARALLEL_BUILD=1 \
              2>&1 | tee build.log | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            RC=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ $RC -eq 0 ] && exit 0
            echo "Attempt $i failed (RC=$RC), sleeping 10s before retry..."
            sleep 10
          done
          exit $RC

      - name: Print disk space
        if: always()
        run: df -h

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-base
          path: build.log
          if-no-files-found: ignore

      - name: Trim and save ccache
        if: success()
        run: |
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M 1G || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-base.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-base.tar.part-*
        continue-on-error: true

      - name: Save ccache (base)
        id: save-cache-base
        uses: ncipollo/release-action@v1.14.0
        if: ${{ hashFiles(format('ccache-{0}-base.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-base.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (base)
        if: steps.save-cache-base.outcome == 'failure'
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 base ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      - name: Compress output
        run: tar --zstd -cf base.tar.zst output/${BOARD}/

      - uses: actions/upload-artifact@v4
        with:
          name:              base-${{ inputs.BOARD }}
          path:              base.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 2b: mame-lr (mame 코어들) — toolchain 직후, base와 병렬
  # ✅ ROCKNIX 패턴: toolchain만 있으면 빌드 가능한 무거운 패키지를 일찍 시작
  # ═════════════════════════════════════════════════════════════════════════
  mame-lr:
    name: ${{ inputs.BOARD }} · 2-mame-lr
    needs: toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-mame-lr.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ inputs.BOARD }}

      - name: Extract toolchain
        run: |
          tar --zstd -xf toolchain.tar.zst
          rm toolchain.tar.zst

      # ✅ B 패턴: mame 계열 패키지 변경 자동 감지 + clean
      - name: Auto-detect and clean changed packages
        env:
          SCOPE_PATTERNS: "libretro-mame* mame*"
        run: |
          bash .github/workflows/clean-changed-packages.sh

      # ✅ batocera 트리(서브모듈)의 mame 본체만 빌드
      #    실제 패키지: libretro-mame (거대 — 단독으로 1.5~2시간)
      #    경량 변형(mame2003-plus, mame2010, mame2016)은 heavy-libretro stage 로 이전
      #    (이유: mame 본체가 critical path 라서 경량 변형이 같이 묻혀 대기하던 문제 해결)
      #    보드 .config에서 BR2_PACKAGE_LIBRETRO_MAME = y 일 때만 빌드
      - name: Detect mame packages enabled for this board
        id: mame-list
        run: |
          # ✅ FIX: 이전 버전은 `make ${BOARD}-build CMD=':'`을 사용했는데 이건
          #         의도적으로 에러를 발생시켜 || true 로 무시하는 추한 트릭이었음.
          #         Makefile 에 `%-config` 타겟이 있으므로 그것을 직접 사용.
          if [ ! -f output/${BOARD}/.config ]; then
            make ${BOARD}-config BATCH_MODE=1
          fi
          PKGS=""
          for P in libretro-mame; do
            VAR="BR2_PACKAGE_$(echo $P | tr 'a-z-' 'A-Z_')"
            if grep -q "^${VAR}=y" output/${BOARD}/.config 2>/dev/null; then
              PKGS="$PKGS $P"
            fi
          done
          PKGS="${PKGS# }"
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          if [ -z "$PKGS" ]; then
            echo "::warning::이 보드는 활성화된 mame 패키지가 없습니다 — 빈 잡으로 통과"
          else
            echo "빌드 대상: $PKGS"
          fi

      - name: Build mame cores
        if: ${{ steps.mame-list.outputs.packages != '' }}
        shell: bash
        run: |
          # ✅ FIX: actions-retry-command was wrapping the whole command in
          #         result=$(...) which buffers every byte until the command
          #         exits. Long builds (mame, qt, libretro) appeared frozen.
          #         Inline retry loop so output streams in real time.
          set +e
          RC=0
          for i in 1 2 3 4 5 6; do
            echo "::group::Attempt $i"
            make ${BOARD}-build CMD='${{ steps.mame-list.outputs.packages }}' \
              BATCH_MODE=1 PARALLEL_BUILD=1 \
              2>&1 | tee build.log | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            RC=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ $RC -eq 0 ] && exit 0
            echo "Attempt $i failed (RC=$RC), sleeping 10s before retry..."
            sleep 10
          done
          exit $RC

      - name: Print disk space
        if: always()
        run: df -h

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-mame-lr
          path: build.log
          if-no-files-found: ignore

      - name: Trim and save ccache
        if: success()
        run: |
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M 500M || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-mame-lr.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-mame-lr.tar.part-*
        continue-on-error: true

      - name: Save ccache (mame-lr)
        id: save-cache-mame-lr
        uses: ncipollo/release-action@v1.14.0
        if: ${{ hashFiles(format('ccache-{0}-mame-lr.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-mame-lr.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (mame-lr)
        if: steps.save-cache-mame-lr.outcome == 'failure'
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 mame-lr ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # ✅ 핵심: 자기가 빌드한 것만 묶어 올림 (per-package + .stamp_libretro-mame*)
      #    빌드 안 한 경우 빈 tar 생성하여 다음 잡 통과
      - name: Pack mame artifacts
        run: |
          if [ -z "${{ steps.mame-list.outputs.packages }}" ]; then
            echo "빌드 안 함 — 빈 아카이브 생성"
            tar --zstd -cf mame-lr.tar.zst --files-from /dev/null
          else
            FILES=""
            for D in $(find output/${BOARD}/per-package -maxdepth 1 -type d \
              \( -name 'libretro-mame' -o -name 'libretro-mame[0-9]*' -o -name 'libretro-mame-*' \) 2>/dev/null); do
              FILES="$FILES $D"
            done
            for D in $(find output/${BOARD}/build -maxdepth 1 -type d \
              \( -name 'libretro-mame-[0-9]*' -o -name 'libretro-mame[0-9]*-[0-9]*' \) 2>/dev/null); do
              FILES="$FILES $D"
            done
            for F in $(find output/${BOARD} -maxdepth 1 -name '.stamp_*' 2>/dev/null); do
              FILES="$FILES $F"
            done
            if [ -z "$FILES" ]; then
              tar --zstd -cf mame-lr.tar.zst --files-from /dev/null
            else
              tar --zstd -cf mame-lr.tar.zst $FILES
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name:              mame-lr-${{ inputs.BOARD }}
          path:              mame-lr.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 3: frontend (Qt6 + EmulationStation)
  # ═════════════════════════════════════════════════════════════════════════
  frontend:
    name: ${{ inputs.BOARD }} · 3-frontend
    needs: base
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-frontend.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - uses: actions/download-artifact@v4
        with:
          name: base-${{ inputs.BOARD }}

      - name: Extract base
        run: |
          tar --zstd -xf base.tar.zst
          rm base.tar.zst

      # ✅ B 패턴: qt6/EmulationStation 관련 변경 자동 감지 + clean
      - name: Auto-detect and clean changed packages
        env:
          SCOPE_PATTERNS: "qt6* batocera-emulationstation* emulationstation*"
        run: |
          bash .github/workflows/clean-changed-packages.sh

      - name: Build Qt6 + EmulationStation
        shell: bash
        run: |
          # ✅ FIX: actions-retry-command was wrapping the whole command in
          #         result=$(...) which buffers every byte until the command
          #         exits. Long builds (mame, qt, libretro) appeared frozen.
          #         Inline retry loop so output streams in real time.
          set +e
          RC=0
          for i in 1 2 3 4 5 6; do
            echo "::group::Attempt $i"
            make ${BOARD}-build CMD='qt6base batocera-emulationstation' \
              BATCH_MODE=1 PARALLEL_BUILD=1 \
              2>&1 | tee build.log | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            RC=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ $RC -eq 0 ] && exit 0
            echo "Attempt $i failed (RC=$RC), sleeping 10s before retry..."
            sleep 10
          done
          exit $RC

      - name: Print disk space
        if: always()
        run: df -h

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-frontend
          path: build.log
          if-no-files-found: ignore

      - name: Trim and save ccache
        if: success()
        run: |
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M 2G || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-frontend.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-frontend.tar.part-*
        continue-on-error: true

      - name: Save ccache (frontend)
        id: save-cache-frontend
        uses: ncipollo/release-action@v1.14.0
        if: ${{ hashFiles(format('ccache-{0}-frontend.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-frontend.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (frontend)
        if: steps.save-cache-frontend.outcome == 'failure'
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 frontend ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # ✅ ROCKNIX 패턴: frontend는 build/ 디렉토리도 별도 업로드
      #    이유: 후속 병렬 잡들이 sysroot/headers/staging 전부 필요한데
      #          build/는 용량이 커서 분리해야 아티팩트 다운로드 시간 절약 가능
      - name: Compress frontend (sysroot + headers, no build/)
        run: |
          tar --zstd --exclude="output/${BOARD}/build" \
            -cf frontend.tar.zst output/${BOARD}/

      - name: Compress frontend build/ separately
        run: |
          tar --zstd -cf frontend-build.tar.zst output/${BOARD}/build/

      - uses: actions/upload-artifact@v4
        with:
          name:              frontend-${{ inputs.BOARD }}
          path:              frontend.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

      - uses: actions/upload-artifact@v4
        with:
          name:              frontend-build-${{ inputs.BOARD }}
          path:              frontend-build.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 4a: heavy-libretro (무거운 libretro 코어들)
  # ✅ mame-lr 의존 제거 — frontend 끝나면 바로 시작, mame는 image 잡에서 merge
  # ═════════════════════════════════════════════════════════════════════════
  heavy-libretro:
    name: ${{ inputs.BOARD }} · 4-heavy-libretro
    needs: frontend
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-heavy-libretro.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      # frontend (sysroot 포함)
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}

      - name: Extract frontend
        run: |
          tar --zstd -xf frontend.tar.zst
          rm frontend.tar.zst

      # frontend build/ (libretro 빌드에 필요)
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ inputs.BOARD }}

      - name: Extract frontend build/
        run: |
          tar --zstd -xf frontend-build.tar.zst
          rm frontend-build.tar.zst

      # ✅ B 패턴: libretro 코어 변경 자동 감지 + clean (mame 계열은 mame-lr 잡 담당이라 제외)
      - name: Auto-detect and clean changed packages
        env:
          SCOPE_PATTERNS:   "libretro-*"
          EXCLUDE_PATTERNS: "libretro-mame*"
        run: |
          bash .github/workflows/clean-changed-packages.sh

      # ✅ batocera 트리의 무거운 libretro 코어들
      #    실제 패키지명 확인됨:
      #      libretro-parallel-n64, libretro-mupen64plus-next, libretro-flycast,
      #      libretro-beetle-saturn, libretro-beetle-psx, libretro-pcsx-rearmed,
      #      libretro-ppsspp, libretro-melonds, libretro-desmume, libretro-dolphin,
      #      libretro-citra, libretro-swanstation, libretro-duckstation 등
      #    h700 같은 약한 SoC는 일부만 활성화돼 있음
      - name: Detect heavy libretro packages enabled for this board
        id: lr-list
        run: |
          if [ ! -f output/${BOARD}/.config ]; then
            make ${BOARD}-config BATCH_MODE=1
          fi
          CANDIDATES="
            libretro-parallel-n64 libretro-mupen64plus-next
            libretro-flycast libretro-beetle-saturn libretro-beetle-psx
            libretro-pcsx-rearmed libretro-ppsspp libretro-melonds
            libretro-desmume libretro-dolphin libretro-citra
            libretro-swanstation libretro-duckstation
            libretro-mame2003-plus libretro-mame2010 libretro-mame2016
          "
          PKGS=""
          for P in $CANDIDATES; do
            VAR="BR2_PACKAGE_$(echo $P | tr 'a-z-' 'A-Z_')"
            if grep -q "^${VAR}=y" output/${BOARD}/.config 2>/dev/null; then
              PKGS="$PKGS $P"
            fi
          done
          PKGS="${PKGS# }"
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          if [ -z "$PKGS" ]; then
            echo "::warning::이 보드는 활성화된 heavy libretro 패키지가 없습니다 — 빈 잡으로 통과"
          else
            echo "빌드 대상: $PKGS"
          fi

      - name: Build heavy libretro cores
        if: ${{ steps.lr-list.outputs.packages != '' }}
        shell: bash
        run: |
          # ✅ FIX: actions-retry-command was wrapping the whole command in
          #         result=$(...) which buffers every byte until the command
          #         exits. Long builds (mame, qt, libretro) appeared frozen.
          #         Inline retry loop so output streams in real time.
          set +e
          RC=0
          for i in 1 2 3 4 5 6; do
            echo "::group::Attempt $i"
            make ${BOARD}-build CMD='${{ steps.lr-list.outputs.packages }}' \
              BATCH_MODE=1 PARALLEL_BUILD=1 \
              2>&1 | tee build.log | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            RC=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ $RC -eq 0 ] && exit 0
            echo "Attempt $i failed (RC=$RC), sleeping 10s before retry..."
            sleep 10
          done
          exit $RC

      - name: Print disk space
        if: always()
        run: df -h

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-heavy-libretro
          path: build.log
          if-no-files-found: ignore

      - name: Trim and save ccache
        if: success()
        run: |
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M 2G || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-heavy-libretro.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-heavy-libretro.tar.part-*
        continue-on-error: true

      - name: Save ccache (heavy-libretro)
        id: save-cache-heavy-libretro
        uses: ncipollo/release-action@v1.14.0
        if: ${{ hashFiles(format('ccache-{0}-heavy-libretro.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-heavy-libretro.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (heavy-libretro)
        if: steps.save-cache-heavy-libretro.outcome == 'failure'
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 heavy-libretro ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # ✅ 핵심: 새로 빌드된 libretro-* per-package + stamp만 묶기
      #    빈 잡일 경우 빈 tar 만들어 다음 잡 통과
      - name: Pack heavy-libretro artifacts
        run: |
          if [ -z "${{ steps.lr-list.outputs.packages }}" ]; then
            echo "빌드 안 함 — 빈 아카이브 생성"
            tar --zstd -cf heavy-libretro.tar.zst --files-from /dev/null
          else
            FILES=""
            for D in $(find output/${BOARD}/per-package -maxdepth 1 -type d -name 'libretro-*' 2>/dev/null); do
              FILES="$FILES $D"
            done
            # ✅ build 디렉토리는 버전 붙은 형태 (libretro-flycast-1.0.x)
            for D in $(find output/${BOARD}/build -maxdepth 1 -type d -name 'libretro-*-[0-9]*' 2>/dev/null); do
              FILES="$FILES $D"
            done
            for F in $(find output/${BOARD} -maxdepth 1 -name '.stamp_*' 2>/dev/null); do
              FILES="$FILES $F"
            done
            if [ -z "$FILES" ]; then
              tar --zstd -cf heavy-libretro.tar.zst --files-from /dev/null
            else
              tar --zstd -cf heavy-libretro.tar.zst $FILES
            fi
          fi

      # ✅ 2GB 초과 시 split (ROCKNIX 패턴)
      - name: Split if > 1.9G
        run: |
          SIZE=$(stat -c%s heavy-libretro.tar.zst)
          if [ "$SIZE" -gt 2040109465 ]; then
            split -b 1900M heavy-libretro.tar.zst heavy-libretro.tar.zst.part
            rm heavy-libretro.tar.zst
            ls -la heavy-libretro.tar.zst.part*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name:              heavy-libretro-${{ inputs.BOARD }}
          path:              heavy-libretro.tar.zst*
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 4b: standalone 에뮬레이터들 (heavy-libretro와 병렬)
  # ✅ mame-lr 의존 제거 — frontend 끝나면 바로 시작 (ROCKNIX와 동일)
  # ═════════════════════════════════════════════════════════════════════════
  standalone:
    name: ${{ inputs.BOARD }} · 4-standalone
    needs: frontend
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-standalone.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}

      - name: Extract frontend
        run: |
          tar --zstd -xf frontend.tar.zst
          rm frontend.tar.zst

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ inputs.BOARD }}

      - name: Extract frontend build/
        run: |
          tar --zstd -xf frontend-build.tar.zst
          rm frontend-build.tar.zst

      # ✅ B 패턴: standalone 에뮬 변경 자동 감지 + clean
      #    libretro-* / mame* 는 다른 잡 담당이므로 제외
      - name: Auto-detect and clean changed packages
        env:
          SCOPE_PATTERNS:   "*"
          EXCLUDE_PATTERNS: "libretro-* mame* linux* uboot* *bootloader* *kernel* qt6* batocera-emulationstation* emulationstation* _BOARD_OVERLAY_"
        run: |
          bash .github/workflows/clean-changed-packages.sh

      # ✅ batocera 트리의 standalone 에뮬레이터들
      #    실제 패키지명 (batocera/package/batocera/emulators/ 아래):
      #      dolphin-emu, ppsspp, citra, duckstation, melonds,
      #      pcsx2, flycast, vita3k 등
      #    h700 같은 작은 SoC는 대부분 비활성화 → 빈 잡으로 빠르게 끝남
      - name: Detect standalone packages enabled for this board
        id: sa-list
        run: |
          if [ ! -f output/${BOARD}/.config ]; then
            make ${BOARD}-config BATCH_MODE=1
          fi
          CANDIDATES="
            dolphin-emu ppsspp citra duckstation melonds
            pcsx2 flycast vita3k yabasanshiro
          "
          PKGS=""
          for P in $CANDIDATES; do
            VAR="BR2_PACKAGE_$(echo $P | tr 'a-z-' 'A-Z_')"
            if grep -q "^${VAR}=y" output/${BOARD}/.config 2>/dev/null; then
              PKGS="$PKGS $P"
            fi
          done
          PKGS="${PKGS# }"
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          if [ -z "$PKGS" ]; then
            echo "::warning::이 보드는 활성화된 standalone 패키지가 없습니다 — 빈 잡으로 통과"
          else
            echo "빌드 대상: $PKGS"
          fi

      - name: Build standalone emulators
        if: ${{ steps.sa-list.outputs.packages != '' }}
        shell: bash
        run: |
          # ✅ FIX: actions-retry-command was wrapping the whole command in
          #         result=$(...) which buffers every byte until the command
          #         exits. Long builds (mame, qt, libretro) appeared frozen.
          #         Inline retry loop so output streams in real time.
          set +e
          RC=0
          for i in 1 2 3 4 5 6; do
            echo "::group::Attempt $i"
            make ${BOARD}-build CMD='${{ steps.sa-list.outputs.packages }}' \
              BATCH_MODE=1 PARALLEL_BUILD=1 \
              2>&1 | tee build.log | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            RC=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ $RC -eq 0 ] && exit 0
            echo "Attempt $i failed (RC=$RC), sleeping 10s before retry..."
            sleep 10
          done
          exit $RC

      - name: Print disk space
        if: always()
        run: df -h

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-standalone
          path: build.log
          if-no-files-found: ignore

      - name: Trim and save ccache
        if: success()
        run: |
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M 2G || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-standalone.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-standalone.tar.part-*
        continue-on-error: true

      - name: Save ccache (standalone)
        id: save-cache-standalone
        uses: ncipollo/release-action@v1.14.0
        if: ${{ hashFiles(format('ccache-{0}-standalone.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-standalone.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (standalone)
        if: steps.save-cache-standalone.outcome == 'failure'
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 standalone ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # ✅ standalone 잡에서 빌드된 패키지들만 명시적으로 묶기
      - name: Pack standalone artifacts
        run: |
          if [ -z "${{ steps.sa-list.outputs.packages }}" ]; then
            echo "빌드 안 함 — 빈 아카이브 생성"
            tar --zstd -cf standalone.tar.zst --files-from /dev/null
          else
            FILES=""
            # ✅ FIX: 이전 버전은 build/${P} 정확 매치였는데, buildroot의 build 디렉토리는
            #         보통 ${P}-<version> 형태라서 아무것도 안 잡혔음.
            #         per-package 디렉토리는 버전 없는 정확 매치, build 디렉토리는
            #         "${P}" 와 "${P}-[0-9]*" 둘 다 처리.
            for P in ${{ steps.sa-list.outputs.packages }}; do
              for D in $(find output/${BOARD}/per-package -maxdepth 1 -type d -name "${P}" 2>/dev/null) \
                       $(find output/${BOARD}/build -maxdepth 1 -type d \( -name "${P}" -o -name "${P}-[0-9]*" \) 2>/dev/null); do
                FILES="$FILES $D"
              done
            done
            for F in $(find output/${BOARD} -maxdepth 1 -name '.stamp_*' 2>/dev/null); do
              FILES="$FILES $F"
            done
            if [ -z "$FILES" ]; then
              tar --zstd -cf standalone.tar.zst --files-from /dev/null
            else
              tar --zstd -cf standalone.tar.zst $FILES
            fi
          fi

      - name: Split if > 1.9G
        run: |
          if [ -f standalone.tar.zst ]; then
            SIZE=$(stat -c%s standalone.tar.zst)
            if [ "$SIZE" -gt 2040109465 ]; then
              split -b 1900M standalone.tar.zst standalone.tar.zst.part
              rm standalone.tar.zst
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name:              standalone-${{ inputs.BOARD }}
          path:              standalone.tar.zst*
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 5: image (모두 merge → 나머지 + 최종 이미지)
  # ═════════════════════════════════════════════════════════════════════════
  image:
    name: ${{ inputs.BOARD }} · 5-image
    needs: [frontend, mame-lr, heavy-libretro, standalone]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      # ── frontend (sysroot 등 베이스)
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}

      - name: Extract frontend
        run: |
          tar --zstd -xf frontend.tar.zst
          rm frontend.tar.zst

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ inputs.BOARD }}

      - name: Extract frontend build/
        run: |
          tar --zstd -xf frontend-build.tar.zst
          rm frontend-build.tar.zst

      # ── heavy-libretro (--skip-old-files: 이미 있는 파일은 덮어쓰지 않음)
      - uses: actions/download-artifact@v4
        with:
          name: heavy-libretro-${{ inputs.BOARD }}

      - name: Extract heavy-libretro
        run: |
          # split 됐을 수 있으니 part* 우선 처리
          if ls heavy-libretro.tar.zst.part* >/dev/null 2>&1; then
            cat heavy-libretro.tar.zst.part* > heavy-libretro.tar.zst
            rm heavy-libretro.tar.zst.part*
          fi
          tar --zstd --skip-old-files -xf heavy-libretro.tar.zst
          rm heavy-libretro.tar.zst

      # ── standalone
      - uses: actions/download-artifact@v4
        with:
          name: standalone-${{ inputs.BOARD }}

      - name: Extract standalone
        run: |
          if ls standalone.tar.zst.part* >/dev/null 2>&1; then
            cat standalone.tar.zst.part* > standalone.tar.zst
            rm standalone.tar.zst.part*
          fi
          tar --zstd --skip-old-files -xf standalone.tar.zst
          rm standalone.tar.zst

      # ── mame-lr (마지막 — heavy-libretro와 standalone 후에 merge)
      - uses: actions/download-artifact@v4
        with:
          name: mame-lr-${{ inputs.BOARD }}

      - name: Extract mame-lr
        run: |
          tar --zstd --skip-old-files -xf mame-lr.tar.zst
          rm mame-lr.tar.zst

      - name: Print disk space (after merge)
        run: df -h

      # ✅ B 패턴: 위 잡들이 안 잡은 모든 변경분 처리
      #    - board overlay 변경 (fsoverlay/, 부트 설정 등) → final image 재생성 강제
      #    - knulli/batocera 자체 패키지 (configs, scripts, system utils 등)
      - name: Auto-detect and clean changed packages
        env:
          SCOPE_PATTERNS:   "*"
          # 다른 잡이 이미 처리한 영역은 제외 (안 그러면 stamp가 또 지워져 재빌드)
          EXCLUDE_PATTERNS: "libretro-* mame* linux* uboot* *bootloader* *kernel* qt6* batocera-emulationstation* emulationstation* dolphin-emu ppsspp citra duckstation melonds pcsx2 flycast vita3k yabasanshiro"
        run: |
          bash .github/workflows/clean-changed-packages.sh

      # ✅ 최종 빌드: 나머지 모든 패키지 + 이미지 생성
      #    .stamp_* 가 다 있으니 위에서 빌드한 것들은 다시 안 됨
      - name: Build remaining + final image
        shell: bash
        run: |
          # ✅ FIX: actions-retry-command was wrapping the whole command in
          #         result=$(...) which buffers every byte until the command
          #         exits. Long builds (mame, qt, libretro) appeared frozen.
          #         Inline retry loop so output streams in real time.
          set +e
          RC=0
          for i in 1 2 3 4 5 6; do
            echo "::group::Attempt $i"
            make ${BOARD}-build BATCH_MODE=1 PARALLEL_BUILD=1 \
              2>&1 | tee build.log | grep -E --color=never --line-buffered '>>>|error:|Error:|FAILED' || true
            RC=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ $RC -eq 0 ] && exit 0
            echo "Attempt $i failed (RC=$RC), sleeping 10s before retry..."
            sleep 10
          done
          exit $RC

      - name: Print disk space
        if: always()
        run: df -h

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-image
          path: build.log
          if-no-files-found: ignore

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: knulli-image-${{ inputs.BOARD }}-${{ inputs.DATE }}
          path: |
            output/${{ inputs.BOARD }}/images/knulli/images/${{ inputs.BOARD }}/knulli-*.img.gz
            output/${{ inputs.BOARD }}/images/knulli/images/${{ inputs.BOARD }}/knulli-*.img.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days:    7

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 6: cleanup (중간 아티팩트 삭제, 디스크/할당량 절약)
  # ═════════════════════════════════════════════════════════════════════════
  cleanup:
    name: ${{ inputs.BOARD }} · 6-cleanup
    needs: image
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@v5
        continue-on-error: true
        with:
          name: |
            toolchain-${{ inputs.BOARD }}
            base-${{ inputs.BOARD }}
            mame-lr-${{ inputs.BOARD }}
            frontend-${{ inputs.BOARD }}
            frontend-build-${{ inputs.BOARD }}
            heavy-libretro-${{ inputs.BOARD }}
            standalone-${{ inputs.BOARD }}
          failOnError: false
