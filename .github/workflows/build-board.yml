          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if [ -d "$CCACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR" || true
            sudo chmod -R a+rwX "$CCACHE_DIR" || true
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M "$CCACHE_MAX_FRONTEND" || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-frontend.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-frontend.tar.part-*
        continue-on-error: true

      - name: Save ccache (frontend)
        id: save-cache-frontend
        uses: ncipollo/release-action@v1.14.0
        if: ${{ !cancelled() && hashFiles(format('ccache-{0}-frontend.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-frontend.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (frontend)
        if: ${{ !cancelled() && steps.save-cache-frontend.outcome == 'failure' }}
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 frontend ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # ✅ ROCKNIX 패턴: frontend는 build/ 디렉토리도 별도 업로드
      #    이유: 후속 병렬 잡들이 sysroot/headers/staging 전부 필요한데
      #          build/는 용량이 커서 분리해야 아티팩트 다운로드 시간 절약 가능
      - name: Compress frontend (sysroot + headers, no build/)
        run: |
          tar --zstd --exclude="output/${BOARD}/build" \
            -cf frontend.tar.zst output/${BOARD}/

      - name: Compress frontend build/ separately
        run: |
          tar --zstd -cf frontend-build.tar.zst output/${BOARD}/build/

      - uses: actions/upload-artifact@v4
        with:
          name:              frontend-${{ inputs.BOARD }}
          path:              frontend.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

      - uses: actions/upload-artifact@v4
        with:
          name:              frontend-build-${{ inputs.BOARD }}
          path:              frontend-build.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 4a: heavy-libretro (무거운 libretro 코어 + libretro-mame)
  # ✅ mame-lr 별도 잡 제거 — libretro-mame 계열도 여기서 함께 빌드
  # ═════════════════════════════════════════════════════════════════════════
  heavy-libretro:
    name: ${{ inputs.BOARD }} · 4-heavy-libretro
    needs: frontend
    if: ${{ needs.frontend.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: H700 batocera-configgen quick workaround
        if: ${{ inputs.BOARD == 'h700' }}
        run: |
          # Temporary fork-local workaround:
          # The current batocera submodule lacks an H700 BATOCERA_CONFIGGEN_SYSTEM mapping.
          # That makes batocera-configgen look for configgen-defaults-.yml during build.
          # Reuse Knulli's H700 defaults under that fallback filename until upstream fixes it.
          install -D -m 0644 \
            package/system/knulli-configgen/configs/configgen-defaults-h700.yml \
            batocera/package/batocera/core/batocera-configgen/configs/configgen-defaults-.yml

      - name: Prepare Buildroot dl dir
        run: mkdir -p "$DL_DIR"

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-heavy-libretro.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar --no-same-owner --no-same-permissions -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - name: Normalize ccache permissions
        run: |
          # Docker/Buildroot may access this directory with a different UID than
          # the GitHub runner. Restored archives can otherwise make ccache fail
          # with: "ccache: error: Permission denied".
          mkdir -p buildroot-ccache
          sudo chown -R "$(id -u):$(id -g)" buildroot-ccache || true
          sudo chmod -R a+rwX buildroot-ccache || true
          echo "buildroot-ccache: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          ls -ld buildroot-ccache

      # frontend (sysroot 포함)
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}

      - name: Extract frontend
        run: |
          tar --zstd -xf frontend.tar.zst
          rm frontend.tar.zst

      # frontend build/ (libretro 빌드에 필요)
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ inputs.BOARD }}

      - name: Extract frontend build/
        run: |
          tar --zstd -xf frontend-build.tar.zst
          rm frontend-build.tar.zst

      # ✅ batocera 트리의 무거운 libretro 코어들 + libretro-mame
      #    실제 패키지명 확인됨:
      #      libretro-parallel-n64, libretro-mupen64plus-next, libretro-flycast,
      #      libretro-beetle-saturn, libretro-beetle-psx, libretro-pcsx-rearmed,
      #      libretro-ppsspp, libretro-melonds, libretro-desmume, libretro-dolphin,
      #      libretro-citra, libretro-swanstation, libretro-duckstation 등
      #    h700 같은 약한 SoC는 일부만 활성화돼 있음
      - name: Detect heavy libretro packages enabled for this board
        id: lr-list
        run: |
          if [ ! -f output/${BOARD}/.config ]; then
            make ${BOARD}-config BATCH_MODE=1
          fi
          CANDIDATES="$HEAVY_LIBRETRO_PACKAGES"
          PKGS=""
          for P in $CANDIDATES; do
            VAR="BR2_PACKAGE_$(echo $P | tr 'a-z-' 'A-Z_')"
            if grep -q "^${VAR}=y" output/${BOARD}/.config 2>/dev/null; then
              PKGS="$PKGS $P"
            fi
          done
          PKGS="${PKGS# }"
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          if [ -z "$PKGS" ]; then
            echo "::warning::이 보드는 활성화된 heavy libretro 패키지가 없습니다 — 빈 잡으로 통과"
          else
            echo "빌드 대상: $PKGS"
          fi

      # 이 시점 이후 새로 생긴 stamp / per-package 디렉토리를 이 잡의 결과물로 묶는다.
      - name: Record package state before build
        run: |
          touch "$RUNNER_TEMP/build-start"
          find output/${BOARD}/per-package -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
            | LC_ALL=C sort > "$RUNNER_TEMP/per-package-before.txt"

      - name: Build heavy libretro cores
        if: ${{ steps.lr-list.outputs.packages != '' }}
        timeout-minutes: 290
        env:
          PKGS: ${{ steps.lr-list.outputs.packages }}
        run: bash .github/workflows/run-build.sh 4-heavy-libretro $PKGS

      - name: Print disk space
        if: always()
        run: df -h


      - name: Show Buildroot dl size
        if: always()
        run: du -sh "$DL_DIR" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-heavy-libretro
          path: |
            build.log
            build-attempt*.log
          if-no-files-found: ignore
          include-hidden-files: true

      # 빌드가 실패하거나 시간 초과로 멈춰도 그때까지 쌓인 ccache 는 저장해 재실행 시간을 줄인다.
      - name: Trim and save ccache
        if: success() || failure()
        run: |
          # 시간 초과로 멈춘 스텝의 빌드 컨테이너가 남아 있으면 먼저 멈춘다.
          docker ps -q | xargs -r docker kill > /dev/null 2>&1 || true
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if [ -d "$CCACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR" || true
            sudo chmod -R a+rwX "$CCACHE_DIR" || true
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M "$CCACHE_MAX_HEAVY_LIBRETRO" || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-heavy-libretro.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-heavy-libretro.tar.part-*
        continue-on-error: true

      - name: Save ccache (heavy-libretro)
        id: save-cache-heavy-libretro
        uses: ncipollo/release-action@v1.14.0
        if: ${{ !cancelled() && hashFiles(format('ccache-{0}-heavy-libretro.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-heavy-libretro.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (heavy-libretro)
        if: ${{ !cancelled() && steps.save-cache-heavy-libretro.outcome == 'failure' }}
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 heavy-libretro ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # ✅ 핵심: 이 잡에서 새로 빌드한 패키지를 의존 패키지까지 모두 묶기 (ROCKNIX 패턴)
      #    libretro-* 만 묶으면 같이 빌드된 의존 패키지(host-clang, retroarch 등)가 버려져
      #    5-build 에서 다시 빌드된다.
      #    빈 잡일 경우 빈 tar 만들어 다음 잡 통과
      - name: Pack heavy-libretro artifacts
        run: |
          if [ -z "${{ steps.lr-list.outputs.packages }}" ]; then
            echo "빌드 안 함 — 빈 아카이브 생성"
            tar --zstd -cf heavy-libretro.tar.zst --files-from /dev/null
          else
            ROOT="output/${BOARD}"
            # 빌드 시작 이후 stamp 가 생긴 build 디렉토리
            find "$ROOT/build" -mindepth 2 -maxdepth 2 -name '.stamp_*' -newer "$RUNNER_TEMP/build-start" -printf '%h\n' \
              | LC_ALL=C sort -u > "$RUNNER_TEMP/new-build.txt"
            # 빌드 시작 이후 생긴 per-package 디렉토리
            find "$ROOT/per-package" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | LC_ALL=C sort \
              | LC_ALL=C comm -13 "$RUNNER_TEMP/per-package-before.txt" - > "$RUNNER_TEMP/new-per-package.txt"
            echo "새로 빌드된 패키지 $(wc -l < "$RUNNER_TEMP/new-build.txt")개:"
            sed 's|.*/||' "$RUNNER_TEMP/new-build.txt" | tr '\n' ' '; echo
            # 설치가 끝난 패키지의 오브젝트 파일은 5-build 에서도 지우므로 미리 빼서 아티팩트를 줄인다.
            grep -v -E '/(linux|uboot)[^/]*$' "$RUNNER_TEMP/new-build.txt" | while read -r D; do
              [ -e "$D/.stamp_installed" ] || continue
              find "$D" -type f -name '*.o' -delete 2>/dev/null || true
              touch "$D/.objects_dropped"
            done
            { cat "$RUNNER_TEMP/new-build.txt" "$RUNNER_TEMP/new-per-package.txt"
              find "$ROOT" -maxdepth 1 -name '.stamp_*'; } > "$RUNNER_TEMP/pack-list.txt"
            tar --zstd -cf heavy-libretro.tar.zst --files-from "$RUNNER_TEMP/pack-list.txt"
          fi

      # ✅ 2GB 초과 시 split (ROCKNIX 패턴)
      - name: Split if > 1.9G
        run: |
          SIZE=$(stat -c%s heavy-libretro.tar.zst)
          if [ "$SIZE" -gt 2040109465 ]; then
            split -b 1900M heavy-libretro.tar.zst heavy-libretro.tar.zst.part
            rm heavy-libretro.tar.zst
            ls -la heavy-libretro.tar.zst.part*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name:              heavy-libretro-${{ inputs.BOARD }}
          path:              heavy-libretro.tar.zst*
          compression-level: 0
          if-no-files-found: error
          retention-days:    1


  libretro:
    name: ${{ inputs.BOARD }} · 4-libretro
    needs: frontend
    if: ${{ needs.frontend.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: H700 batocera-configgen quick workaround
        if: ${{ inputs.BOARD == 'h700' }}
        run: |
          # Temporary fork-local workaround:
          # The current batocera submodule lacks an H700 BATOCERA_CONFIGGEN_SYSTEM mapping.
          # That makes batocera-configgen look for configgen-defaults-.yml during build.
          # Reuse Knulli's H700 defaults under that fallback filename until upstream fixes it.
          install -D -m 0644 \
            package/system/knulli-configgen/configs/configgen-defaults-h700.yml \
            batocera/package/batocera/core/batocera-configgen/configs/configgen-defaults-.yml

      - name: Prepare Buildroot dl dir
        run: mkdir -p "$DL_DIR"

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-libretro.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar --no-same-owner --no-same-permissions -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - name: Normalize ccache permissions
        run: |
          # Docker/Buildroot may access this directory with a different UID than
          # the GitHub runner. Restored archives can otherwise make ccache fail
          # with: "ccache: error: Permission denied".
          mkdir -p buildroot-ccache
          sudo chown -R "$(id -u):$(id -g)" buildroot-ccache || true
          sudo chmod -R a+rwX buildroot-ccache || true
          echo "buildroot-ccache: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          ls -ld buildroot-ccache

      # frontend (sysroot 포함)
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}

      - name: Extract frontend
        run: |
          tar --zstd -xf frontend.tar.zst
          rm frontend.tar.zst

      # frontend build/ (libretro 빌드에 필요)
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ inputs.BOARD }}

      - name: Extract frontend build/
        run: |
          tar --zstd -xf frontend-build.tar.zst
          rm frontend-build.tar.zst

      # ✅ 일반 libretro 코어들
      #    heavy-libretro가 담당하는 대형 코어를 제외하고,
      #    .config에서 활성화된 나머지 libretro-* 패키지를 자동 감지해 빌드.
      - name: Detect remaining libretro packages enabled for this board
        id: lr-list
        run: |
          if [ ! -f output/${BOARD}/.config ]; then
            make ${BOARD}-config BATCH_MODE=1
          fi
          HEAVY_PACKAGES=" $HEAVY_LIBRETRO_PACKAGES "
          PKGS=""
          while IFS= read -r VAR; do
            P="$(echo "${VAR#BR2_PACKAGE_}" | tr 'A-Z_' 'a-z-')"
            case "$HEAVY_PACKAGES" in
              *" $P "*) continue ;;
            esac
            # 실제 패키지 디렉토리가 있는 libretro 계열만 빌드 대상으로 채택.
            if [ -d "package/cores/$P" ] || \
               [ -d "package/batocera/emulators/retroarch/libretro/$P" ] || \
               [ -d "batocera/package/batocera/emulators/retroarch/libretro/$P" ]; then
              PKGS="$PKGS $P"
            fi
          done < <(grep -E '^BR2_PACKAGE_LIBRETRO_[A-Z0-9_]+=y$' output/${BOARD}/.config | cut -d= -f1 | sort -u)
          PKGS="${PKGS# }"
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          if [ -z "$PKGS" ]; then
            echo "::warning::이 보드는 활성화된 remaining libretro 패키지가 없습니다 — 빈 잡으로 통과"
          else
            echo "빌드 대상: $PKGS"
          fi

      # 이 시점 이후 새로 생긴 stamp / per-package 디렉토리를 이 잡의 결과물로 묶는다.
      - name: Record package state before build
        run: |
          touch "$RUNNER_TEMP/build-start"
          find output/${BOARD}/per-package -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
            | LC_ALL=C sort > "$RUNNER_TEMP/per-package-before.txt"

      - name: Build remaining libretro cores
        if: ${{ steps.lr-list.outputs.packages != '' }}
        timeout-minutes: 290
        env:
          PKGS: ${{ steps.lr-list.outputs.packages }}
        run: bash .github/workflows/run-build.sh 4-libretro $PKGS

      - name: Print disk space
        if: always()
        run: df -h


      - name: Show Buildroot dl size
        if: always()
        run: du -sh "$DL_DIR" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-libretro
          path: |
            build.log
            build-attempt*.log
          if-no-files-found: ignore
          include-hidden-files: true

      # 빌드가 실패하거나 시간 초과로 멈춰도 그때까지 쌓인 ccache 는 저장해 재실행 시간을 줄인다.
      - name: Trim and save ccache
        if: success() || failure()
        run: |
          # 시간 초과로 멈춘 스텝의 빌드 컨테이너가 남아 있으면 먼저 멈춘다.
          docker ps -q | xargs -r docker kill > /dev/null 2>&1 || true
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if [ -d "$CCACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR" || true
            sudo chmod -R a+rwX "$CCACHE_DIR" || true
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M "$CCACHE_MAX_LIBRETRO" || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-libretro.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-libretro.tar.part-*
        continue-on-error: true

      - name: Save ccache (libretro)
        id: save-cache-libretro
        uses: ncipollo/release-action@v1.14.0
        if: ${{ !cancelled() && hashFiles(format('ccache-{0}-libretro.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-libretro.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (libretro)
        if: ${{ !cancelled() && steps.save-cache-libretro.outcome == 'failure' }}
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 libretro ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # ✅ 핵심: 이 잡에서 새로 빌드한 패키지를 의존 패키지까지 모두 묶기 (ROCKNIX 패턴)
      #    libretro-* 만 묶으면 같이 빌드된 의존 패키지(host-clang, retroarch 등)가 버려져
      #    5-build 에서 다시 빌드된다.
      #    빈 잡일 경우 빈 tar 만들어 다음 잡 통과
      - name: Pack libretro artifacts
        run: |
          if [ -z "${{ steps.lr-list.outputs.packages }}" ]; then
            echo "빌드 안 함 — 빈 아카이브 생성"
            tar --zstd -cf libretro.tar.zst --files-from /dev/null
          else
            ROOT="output/${BOARD}"
            # 빌드 시작 이후 stamp 가 생긴 build 디렉토리
            find "$ROOT/build" -mindepth 2 -maxdepth 2 -name '.stamp_*' -newer "$RUNNER_TEMP/build-start" -printf '%h\n' \
              | LC_ALL=C sort -u > "$RUNNER_TEMP/new-build.txt"
            # 빌드 시작 이후 생긴 per-package 디렉토리
            find "$ROOT/per-package" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | LC_ALL=C sort \
              | LC_ALL=C comm -13 "$RUNNER_TEMP/per-package-before.txt" - > "$RUNNER_TEMP/new-per-package.txt"
            echo "새로 빌드된 패키지 $(wc -l < "$RUNNER_TEMP/new-build.txt")개:"
            sed 's|.*/||' "$RUNNER_TEMP/new-build.txt" | tr '\n' ' '; echo
            # 설치가 끝난 패키지의 오브젝트 파일은 5-build 에서도 지우므로 미리 빼서 아티팩트를 줄인다.
            grep -v -E '/(linux|uboot)[^/]*$' "$RUNNER_TEMP/new-build.txt" | while read -r D; do
              [ -e "$D/.stamp_installed" ] || continue
              find "$D" -type f -name '*.o' -delete 2>/dev/null || true
              touch "$D/.objects_dropped"
            done
            { cat "$RUNNER_TEMP/new-build.txt" "$RUNNER_TEMP/new-per-package.txt"
              find "$ROOT" -maxdepth 1 -name '.stamp_*'; } > "$RUNNER_TEMP/pack-list.txt"
            tar --zstd -cf libretro.tar.zst --files-from "$RUNNER_TEMP/pack-list.txt"
          fi

      # ✅ 2GB 초과 시 split (ROCKNIX 패턴)
      - name: Split if > 1.9G
        run: |
          SIZE=$(stat -c%s libretro.tar.zst)
          if [ "$SIZE" -gt 2040109465 ]; then
            split -b 1900M libretro.tar.zst libretro.tar.zst.part
            rm libretro.tar.zst
            ls -la libretro.tar.zst.part*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name:              libretro-${{ inputs.BOARD }}
          path:              libretro.tar.zst*
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 4b: standalone 에뮬레이터들 (heavy-libretro와 병렬)
  # ✅ mame-lr 의존 제거 — frontend 끝나면 바로 시작 (ROCKNIX와 동일)
  # ═════════════════════════════════════════════════════════════════════════
  standalone:
    name: ${{ inputs.BOARD }} · 4-standalone
    needs: frontend
    if: ${{ needs.frontend.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: H700 batocera-configgen quick workaround
        if: ${{ inputs.BOARD == 'h700' }}
        run: |
          # Temporary fork-local workaround:
          # The current batocera submodule lacks an H700 BATOCERA_CONFIGGEN_SYSTEM mapping.
          # That makes batocera-configgen look for configgen-defaults-.yml during build.
          # Reuse Knulli's H700 defaults under that fallback filename until upstream fixes it.
          install -D -m 0644 \
            package/system/knulli-configgen/configs/configgen-defaults-h700.yml \
            batocera/package/batocera/core/batocera-configgen/configs/configgen-defaults-.yml

      - name: Prepare Buildroot dl dir
        run: mkdir -p "$DL_DIR"

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-standalone.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar --no-same-owner --no-same-permissions -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - name: Normalize ccache permissions
        run: |
          # Docker/Buildroot may access this directory with a different UID than
          # the GitHub runner. Restored archives can otherwise make ccache fail
          # with: "ccache: error: Permission denied".
          mkdir -p buildroot-ccache
          sudo chown -R "$(id -u):$(id -g)" buildroot-ccache || true
          sudo chmod -R a+rwX buildroot-ccache || true
          echo "buildroot-ccache: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          ls -ld buildroot-ccache

      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}

      - name: Extract frontend
        run: |
          tar --zstd -xf frontend.tar.zst
          rm frontend.tar.zst

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ inputs.BOARD }}

      - name: Extract frontend build/
        run: |
          tar --zstd -xf frontend-build.tar.zst
          rm frontend-build.tar.zst

      # ✅ batocera 트리의 standalone 에뮬레이터들
      #    실제 패키지명 (batocera/package/batocera/emulators/ 아래):
      #      dolphin-emu, ppsspp, citra, duckstation, melonds,
      #      pcsx2, flycast, vita3k 등
      #    h700 같은 작은 SoC는 대부분 비활성화 → 빈 잡으로 빠르게 끝남
      - name: Detect standalone packages enabled for this board
        id: sa-list
        run: |
          if [ ! -f output/${BOARD}/.config ]; then
            make ${BOARD}-config BATCH_MODE=1
          fi
          CANDIDATES="$STANDALONE_PACKAGES"
          PKGS=""
          for P in $CANDIDATES; do
            VAR="BR2_PACKAGE_$(echo $P | tr 'a-z-' 'A-Z_')"
            if grep -q "^${VAR}=y" output/${BOARD}/.config 2>/dev/null; then
              PKGS="$PKGS $P"
            fi
          done
          PKGS="${PKGS# }"
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          if [ -z "$PKGS" ]; then
            echo "::warning::이 보드는 활성화된 standalone 패키지가 없습니다 — 빈 잡으로 통과"
          else
            echo "빌드 대상: $PKGS"
          fi

      # 이 시점 이후 새로 생긴 stamp / per-package 디렉토리를 이 잡의 결과물로 묶는다.
      - name: Record package state before build
        run: |
          touch "$RUNNER_TEMP/build-start"
          find output/${BOARD}/per-package -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
            | LC_ALL=C sort > "$RUNNER_TEMP/per-package-before.txt"

      - name: Build standalone emulators
        if: ${{ steps.sa-list.outputs.packages != '' }}
        timeout-minutes: 290
        env:
          PKGS: ${{ steps.sa-list.outputs.packages }}
        run: bash .github/workflows/run-build.sh 4-standalone $PKGS

      - name: Print disk space
        if: always()
        run: df -h


      - name: Show Buildroot dl size
        if: always()
        run: du -sh "$DL_DIR" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-standalone
          path: |
            build.log
            build-attempt*.log
          if-no-files-found: ignore
          include-hidden-files: true

      # 빌드가 실패하거나 시간 초과로 멈춰도 그때까지 쌓인 ccache 는 저장해 재실행 시간을 줄인다.
      - name: Trim and save ccache
        if: success() || failure()
        run: |
          # 시간 초과로 멈춘 스텝의 빌드 컨테이너가 남아 있으면 먼저 멈춘다.
          docker ps -q | xargs -r docker kill > /dev/null 2>&1 || true
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if [ -d "$CCACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR" || true
            sudo chmod -R a+rwX "$CCACHE_DIR" || true
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M "$CCACHE_MAX_STANDALONE" || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-standalone.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-standalone.tar.part-*
        continue-on-error: true

      - name: Save ccache (standalone)
        id: save-cache-standalone
        uses: ncipollo/release-action@v1.14.0
        if: ${{ !cancelled() && hashFiles(format('ccache-{0}-standalone.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-standalone.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (standalone)
        if: ${{ !cancelled() && steps.save-cache-standalone.outcome == 'failure' }}
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 standalone ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # ✅ 이 잡에서 새로 빌드한 패키지를 의존 패키지까지 모두 묶기 (ROCKNIX 패턴)
      #    에뮬레이터 패키지만 묶으면 같이 빌드된 의존 패키지가 버려져 5-build 에서 다시 빌드된다.
      - name: Pack standalone artifacts
        run: |
          if [ -z "${{ steps.sa-list.outputs.packages }}" ]; then
            echo "빌드 안 함 — 빈 아카이브 생성"
            tar --zstd -cf standalone.tar.zst --files-from /dev/null
          else
            ROOT="output/${BOARD}"
            # 빌드 시작 이후 stamp 가 생긴 build 디렉토리
            find "$ROOT/build" -mindepth 2 -maxdepth 2 -name '.stamp_*' -newer "$RUNNER_TEMP/build-start" -printf '%h\n' \
              | LC_ALL=C sort -u > "$RUNNER_TEMP/new-build.txt"
            # 빌드 시작 이후 생긴 per-package 디렉토리
            find "$ROOT/per-package" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | LC_ALL=C sort \
              | LC_ALL=C comm -13 "$RUNNER_TEMP/per-package-before.txt" - > "$RUNNER_TEMP/new-per-package.txt"
            echo "새로 빌드된 패키지 $(wc -l < "$RUNNER_TEMP/new-build.txt")개:"
            sed 's|.*/||' "$RUNNER_TEMP/new-build.txt" | tr '\n' ' '; echo
            # 설치가 끝난 패키지의 오브젝트 파일은 5-build 에서도 지우므로 미리 빼서 아티팩트를 줄인다.
            grep -v -E '/(linux|uboot)[^/]*$' "$RUNNER_TEMP/new-build.txt" | while read -r D; do
              [ -e "$D/.stamp_installed" ] || continue
              find "$D" -type f -name '*.o' -delete 2>/dev/null || true
              touch "$D/.objects_dropped"
            done
            { cat "$RUNNER_TEMP/new-build.txt" "$RUNNER_TEMP/new-per-package.txt"
              find "$ROOT" -maxdepth 1 -name '.stamp_*'; } > "$RUNNER_TEMP/pack-list.txt"
            tar --zstd -cf standalone.tar.zst --files-from "$RUNNER_TEMP/pack-list.txt"
          fi

      - name: Split if > 1.9G
        run: |
          if [ -f standalone.tar.zst ]; then
            SIZE=$(stat -c%s standalone.tar.zst)
            if [ "$SIZE" -gt 2040109465 ]; then
              split -b 1900M standalone.tar.zst standalone.tar.zst.part
              rm standalone.tar.zst
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name:              standalone-${{ inputs.BOARD }}
          path:              standalone.tar.zst*
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 5: build (모두 merge → 나머지 + 최종 이미지)
  # ═════════════════════════════════════════════════════════════════════════
  standalone-heavy:
    name: ${{ inputs.BOARD }} · 4-standalone-heavy
    needs: frontend
    if: ${{ needs.frontend.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            false
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: H700 batocera-configgen quick workaround
        if: ${{ inputs.BOARD == 'h700' }}
        run: |
          # Temporary fork-local workaround:
          # The current batocera submodule lacks an H700 BATOCERA_CONFIGGEN_SYSTEM mapping.
          # That makes batocera-configgen look for configgen-defaults-.yml during build.
          # Reuse Knulli's H700 defaults under that fallback filename until upstream fixes it.
          install -D -m 0644 \
            package/system/knulli-configgen/configs/configgen-defaults-h700.yml \
            batocera/package/batocera/core/batocera-configgen/configs/configgen-defaults-.yml

      - name: Prepare Buildroot dl dir
        run: mkdir -p "$DL_DIR"

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-standalone-heavy.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar --no-same-owner --no-same-permissions -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - name: Normalize ccache permissions
        run: |
          # Docker/Buildroot may access this directory with a different UID than
          # the GitHub runner. Restored archives can otherwise make ccache fail
          # with: "ccache: error: Permission denied".
          mkdir -p buildroot-ccache
          sudo chown -R "$(id -u):$(id -g)" buildroot-ccache || true
          sudo chmod -R a+rwX buildroot-ccache || true
          echo "buildroot-ccache: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          ls -ld buildroot-ccache

      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}

      - name: Extract frontend
        run: |
          tar --zstd -xf frontend.tar.zst
          rm frontend.tar.zst

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ inputs.BOARD }}

      - name: Extract frontend build/
        run: |
          tar --zstd -xf frontend-build.tar.zst
          rm frontend-build.tar.zst

      # ✅ batocera 트리의 standalone 에뮬레이터들
      #    실제 패키지명 (batocera/package/batocera/emulators/ 아래):
      #      dolphin-emu, ppsspp, citra, duckstation, melonds,
      #      pcsx2, flycast, vita3k 등
      #    h700 같은 작은 SoC는 대부분 비활성화 → 빈 잡으로 빠르게 끝남
      - name: Detect standalone packages enabled for this board
        id: sa-list
        run: |
          if [ ! -f output/${BOARD}/.config ]; then
            make ${BOARD}-config BATCH_MODE=1
          fi
          CANDIDATES="$STANDALONE_HEAVY_PACKAGES"
          PKGS=""
          for P in $CANDIDATES; do
            VAR="BR2_PACKAGE_$(echo $P | tr 'a-z-' 'A-Z_')"
            if grep -q "^${VAR}=y" output/${BOARD}/.config 2>/dev/null; then
              PKGS="$PKGS $P"
            fi
          done
          PKGS="${PKGS# }"
          echo "packages=$PKGS" >> $GITHUB_OUTPUT
          if [ -z "$PKGS" ]; then
            echo "::warning::이 보드는 활성화된 standalone 패키지가 없습니다 — 빈 잡으로 통과"
          else
            echo "빌드 대상: $PKGS"
          fi

      # 이 시점 이후 새로 생긴 stamp / per-package 디렉토리를 이 잡의 결과물로 묶는다.
      - name: Record package state before build
        run: |
          touch "$RUNNER_TEMP/build-start"
          find output/${BOARD}/per-package -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
            | LC_ALL=C sort > "$RUNNER_TEMP/per-package-before.txt"

      - name: Build standalone emulators
        if: ${{ steps.sa-list.outputs.packages != '' }}
        timeout-minutes: 290
        env:
          PKGS: ${{ steps.sa-list.outputs.packages }}
        run: bash .github/workflows/run-build.sh 4-standalone-heavy $PKGS

      - name: Print disk space
        if: always()
        run: df -h


      - name: Show Buildroot dl size
        if: always()
        run: du -sh "$DL_DIR" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-standalone-heavy
          path: |
            build.log
            build-attempt*.log
          if-no-files-found: ignore
          include-hidden-files: true

      # 빌드가 실패하거나 시간 초과로 멈춰도 그때까지 쌓인 ccache 는 저장해 재실행 시간을 줄인다.
      - name: Trim and save ccache
        if: success() || failure()
        run: |
          # 시간 초과로 멈춘 스텝의 빌드 컨테이너가 남아 있으면 먼저 멈춘다.
          docker ps -q | xargs -r docker kill > /dev/null 2>&1 || true
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if [ -d "$CCACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR" || true
            sudo chmod -R a+rwX "$CCACHE_DIR" || true
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M "$CCACHE_MAX_STANDALONE" || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-standalone-heavy.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-standalone-heavy.tar.part-*
        continue-on-error: true

      - name: Save ccache (standalone-heavy)
        id: save-cache-standalone-heavy
        uses: ncipollo/release-action@v1.14.0
        if: ${{ !cancelled() && hashFiles(format('ccache-{0}-standalone-heavy.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-standalone-heavy.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (standalone-heavy)
        if: ${{ !cancelled() && steps.save-cache-standalone-heavy.outcome == 'failure' }}
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 standalone ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # ✅ 이 잡에서 새로 빌드한 패키지를 의존 패키지까지 모두 묶기 (ROCKNIX 패턴)
      #    에뮬레이터 패키지만 묶으면 같이 빌드된 의존 패키지가 버려져 5-build 에서 다시 빌드된다.
      - name: Pack standalone artifacts
        run: |
          if [ -z "${{ steps.sa-list.outputs.packages }}" ]; then
            echo "빌드 안 함 — 빈 아카이브 생성"
            tar --zstd -cf standalone-heavy.tar.zst --files-from /dev/null
          else
            ROOT="output/${BOARD}"
            # 빌드 시작 이후 stamp 가 생긴 build 디렉토리
            find "$ROOT/build" -mindepth 2 -maxdepth 2 -name '.stamp_*' -newer "$RUNNER_TEMP/build-start" -printf '%h\n' \
              | LC_ALL=C sort -u > "$RUNNER_TEMP/new-build.txt"
            # 빌드 시작 이후 생긴 per-package 디렉토리
            find "$ROOT/per-package" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | LC_ALL=C sort \
              | LC_ALL=C comm -13 "$RUNNER_TEMP/per-package-before.txt" - > "$RUNNER_TEMP/new-per-package.txt"
            echo "새로 빌드된 패키지 $(wc -l < "$RUNNER_TEMP/new-build.txt")개:"
            sed 's|.*/||' "$RUNNER_TEMP/new-build.txt" | tr '\n' ' '; echo
            # 설치가 끝난 패키지의 오브젝트 파일은 5-build 에서도 지우므로 미리 빼서 아티팩트를 줄인다.
            grep -v -E '/(linux|uboot)[^/]*$' "$RUNNER_TEMP/new-build.txt" | while read -r D; do
              [ -e "$D/.stamp_installed" ] || continue
              find "$D" -type f -name '*.o' -delete 2>/dev/null || true
              touch "$D/.objects_dropped"
            done
            { cat "$RUNNER_TEMP/new-build.txt" "$RUNNER_TEMP/new-per-package.txt"
              find "$ROOT" -maxdepth 1 -name '.stamp_*'; } > "$RUNNER_TEMP/pack-list.txt"
            tar --zstd -cf standalone-heavy.tar.zst --files-from "$RUNNER_TEMP/pack-list.txt"
          fi

      - name: Split if > 1.9G
        run: |
          if [ -f standalone-heavy.tar.zst ]; then
            SIZE=$(stat -c%s standalone-heavy.tar.zst)
            if [ "$SIZE" -gt 2040109465 ]; then
              split -b 1900M standalone-heavy.tar.zst standalone-heavy.tar.zst.part
              rm standalone-heavy.tar.zst
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name:              standalone-heavy-${{ inputs.BOARD }}
          path:              standalone-heavy.tar.zst*
          compression-level: 0
          if-no-files-found: error
          retention-days:    1

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 5: build (모두 merge → 나머지 + 최종 이미지)
  # ═════════════════════════════════════════════════════════════════════════

  image:
    name: ${{ inputs.BOARD }} · 5-build
    needs: [frontend, heavy-libretro, libretro, standalone, standalone-heavy]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.frontend.result == 'success' &&
        needs.heavy-libretro.result == 'success' &&
        needs.libretro.result == 'success' &&
        needs.standalone.result == 'success' &&
        needs['standalone-heavy'].result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 350
    steps:
      - name: Free runner disk before build volume setup
        run: |
          # maximize-build-space 는 /mnt/swapfile 만 지우므로 /swapfile 과
          # 이 잡에서 쓰지 않는 사전 설치 도구를 먼저 지워 빌드 볼륨을 키운다.
          df -h /
          sudo swapoff -a
          sudo rm -rf /swapfile /mnt/swapfile \
            /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /usr/lib/jvm /usr/lib/google-cloud-sdk \
            /opt/microsoft /opt/google /opt/az /opt/pipx /usr/local/julia* \
            /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli \
            /usr/local/share/vcpkg /usr/share/kotlinc
          df -h /
          command -v mkfs.btrfs >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q btrfs-progs; }

      - uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs:            true
          btrfs-discard-async:  true
          root-reserve-mb:      6144
          swap-size-mb:         8192
          overprovision-lvm:    true
          remove-dotnet:        true
          remove-android:       true
          remove-haskell:       true
          remove-codeql:        true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: H700 batocera-configgen quick workaround
        if: ${{ inputs.BOARD == 'h700' }}
        run: |
          # Temporary fork-local workaround:
          # The current batocera submodule lacks an H700 BATOCERA_CONFIGGEN_SYSTEM mapping.
          # That makes batocera-configgen look for configgen-defaults-.yml during build.
          # Reuse Knulli's H700 defaults under that fallback filename until upstream fixes it.
          install -D -m 0644 \
            package/system/knulli-configgen/configs/configgen-defaults-h700.yml \
            batocera/package/batocera/core/batocera-configgen/configs/configgen-defaults-.yml

      - name: Prepare Buildroot dl dir
        run: mkdir -p "$DL_DIR"

      - name: Prepare docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest"
          docker tag  "ghcr.io/${{ inputs.OWNER_LC }}/knulli-build:latest" knulli/knulli-build:latest
          touch .ba-docker-image-available

      - name: Retrieve ccache
        # ✅ FIX: ROCKNIX 패턴 — ccache 는 항상 1900M 단위로 split 되어 release 에 올라감.
        #         (GitHub release asset 의 2GB 한계 회피). part-aa/ab/... 시퀀스로 받아서 cat.
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache"
          PREFIX="ccache-${{ inputs.BOARD }}-build.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              rm -f "$FILE"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "ccache 없음 — 첫 빌드 또는 아직 캐시 미생성"
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          if tar --no-same-owner --no-same-permissions -C "$(pwd)" -xf ccache.tar; then
            echo "ccache 복원 완료: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          else
            echo "ccache extract 실패 — 무시하고 진행"
          fi
          rm -f ${PREFIX}* ccache.tar

      - name: Normalize ccache permissions
        run: |
          # Docker/Buildroot may access this directory with a different UID than
          # the GitHub runner. Restored archives can otherwise make ccache fail
          # with: "ccache: error: Permission denied".
          mkdir -p buildroot-ccache
          sudo chown -R "$(id -u):$(id -g)" buildroot-ccache || true
          sudo chmod -R a+rwX buildroot-ccache || true
          echo "buildroot-ccache: $(du -sh buildroot-ccache 2>/dev/null | cut -f1)"
          ls -ld buildroot-ccache

      # ── frontend (sysroot 등 베이스)
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ inputs.BOARD }}

      - name: Extract frontend
        run: |
          tar --zstd -xf frontend.tar.zst
          rm frontend.tar.zst

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ inputs.BOARD }}

      - name: Extract frontend build/
        run: |
          tar --zstd -xf frontend-build.tar.zst
          rm frontend-build.tar.zst

      # ── heavy-libretro (--skip-old-files: 이미 있는 파일은 덮어쓰지 않음)
      - uses: actions/download-artifact@v4
        with:
          name: heavy-libretro-${{ inputs.BOARD }}

      - name: Extract heavy-libretro
        run: |
          # split 됐을 수 있으니 part* 우선 처리
          if ls heavy-libretro.tar.zst.part* >/dev/null 2>&1; then
            cat heavy-libretro.tar.zst.part* > heavy-libretro.tar.zst
            rm heavy-libretro.tar.zst.part*
          fi
          tar --zstd --skip-old-files -xf heavy-libretro.tar.zst
          rm heavy-libretro.tar.zst

      # ── libretro-rest
      - uses: actions/download-artifact@v4
        with:
          name: libretro-${{ inputs.BOARD }}

      - name: Extract libretro-rest
        run: |
          if ls libretro.tar.zst.part* >/dev/null 2>&1; then
            cat libretro.tar.zst.part* > libretro.tar.zst
            rm libretro.tar.zst.part*
          fi
          tar --zstd --skip-old-files -xf libretro.tar.zst
          rm libretro.tar.zst

      # ── standalone
      - uses: actions/download-artifact@v4
        with:
          name: standalone-${{ inputs.BOARD }}

      - name: Extract standalone
        run: |
          if ls standalone.tar.zst.part* >/dev/null 2>&1; then
            cat standalone.tar.zst.part* > standalone.tar.zst
            rm standalone.tar.zst.part*
          fi
          tar --zstd --skip-old-files -xf standalone.tar.zst
          rm standalone.tar.zst

      - name: Print disk space (after merge)
        run: df -h

      # ── standalone-heavy
      - uses: actions/download-artifact@v4
        with:
          name: standalone-heavy-${{ inputs.BOARD }}

      - name: Extract standalone-heavy
        run: |
          if ls standalone-heavy.tar.zst.part* >/dev/null 2>&1; then
            cat standalone-heavy.tar.zst.part* > standalone-heavy.tar.zst
            rm standalone-heavy.tar.zst.part*
          fi
          tar --zstd --skip-old-files -xf standalone-heavy.tar.zst
          rm standalone-heavy.tar.zst

      # ✅ 최종 빌드: 병렬 stage 결과 merge 후 잔여 패키지 + 이미지 생성
      #    .stamp_* 가 다 있으니 위에서 빌드한 것들은 다시 안 됨
      - name: Free disk before final build
        run: |
          set -e

          ROOT="output/${{ inputs.BOARD }}"

          echo "Freeing disk before final build..."
          echo "Workspace: $PWD"

          if [ ! -d "$ROOT" ]; then
            echo "ERROR: Build root not found: $ROOT"
            find . -maxdepth 4 -type d -name "${{ inputs.BOARD }}" -print || true
            df -h
            exit 1
          fi

          echo "Before cleanup:"
          du -sh "$ROOT" "$ROOT/host" "$ROOT/per-package" "$ROOT/build" 2>/dev/null || true
          du -sh "$ROOT/per-package/host-go-src" "$ROOT/per-package/host-go" 2>/dev/null || true
          find "$ROOT/per-package" -path "*/host/lib/go-*/src" -type d -prune -exec du -sh {} \; 2>/dev/null || true
          find "$ROOT/per-package" -path "*/host/share/go-cache" -type d -prune -exec du -sh {} \; 2>/dev/null || true
          df -h

          echo "Drop merged host dir; Buildroot host-finalize will recreate it."
          rm -rf "$ROOT/host"
          mkdir -p "$ROOT/host"

          echo "Drop Go build caches from per-package hosts."
          find "$ROOT/per-package" \
            -path "*/host/share/go-cache" \
            -type d -prune -print -exec rm -rf {} + 2>/dev/null || true

          echo "Drop Go source trees from per-package hosts."
          find "$ROOT/per-package" \
            -path "*/host/lib/go-*/src" \
            -type d -prune -print -exec rm -rf {} + 2>/dev/null || true

          echo "Drop Go test trees from per-package hosts."
          find "$ROOT/per-package" \
            -path "*/host/lib/go-*/test" \
            -type d -prune -print -exec rm -rf {} + 2>/dev/null || true

          echo "Drop object files from installed packages (except linux/uboot)."
          find "$ROOT/build" -mindepth 2 -maxdepth 2 -name .stamp_installed -printf '%h\n' \
            | grep -v -E '/(linux|uboot)[^/]*$' \
            | while read -r D; do
                find "$D" -type f -name '*.o' -delete 2>/dev/null || true
                touch "$D/.objects_dropped"
              done

          echo "Largest build dirs:"
          du -sh "$ROOT"/build/* 2>/dev/null | sort -h | tail -n 20 || true

          echo "After cleanup:"
          du -sh "$ROOT" "$ROOT/host" "$ROOT/per-package" "$ROOT/build" 2>/dev/null || true
          du -sh "$ROOT/per-package/host-go-src" "$ROOT/per-package/host-go" 2>/dev/null || true
          df -h

          echo "Verify no Go source/cache trees remain in per-package hosts:"
          find "$ROOT/per-package" \
            \( -path "*/host/lib/go-*/src" -o -path "*/host/lib/go-*/test" -o -path "*/host/share/go-cache" \) \
            -type d -prune -print | head -50

          if find "$ROOT/per-package" \
            \( -path "*/host/lib/go-*/src" -o -path "*/host/lib/go-*/test" -o -path "*/host/share/go-cache" \) \
            -type d -prune -print | grep -q .; then
            echo "ERROR: Go source/cache trees still remain after cleanup"
            exit 1
          fi

      - name: Ensure per-package host directories exist
        run: |
          PPD="output/${{ inputs.BOARD }}/per-package"
          echo "Ensuring per-package host/target directories exist..."
          if [ -d "$PPD" ]; then
            find "$PPD" -mindepth 1 -maxdepth 1 -type d \
              -exec mkdir -p "{}/host" "{}/target" \;
          fi

          echo "per-package dirs:"
          find "$PPD" -mindepth 1 -maxdepth 1 -type d | wc -l || true

          echo "missing host dirs after repair:"
          find "$PPD" -mindepth 1 -maxdepth 1 -type d \
            ! -exec test -d "{}/host" \; -print | head -50 || true

      - name: Finalize build and image
        timeout-minutes: 280
        env:
          # 설치가 끝난 패키지의 오브젝트 파일은 더 쓰이지 않으므로 빌드 중에 지워 디스크를 확보한다.
          DROP_OBJECTS: "1"
        run: bash .github/workflows/run-build.sh 5-build

      - name: Print disk space
        if: always()
        run: df -h


      - name: Show Buildroot dl size
        if: always()
        run: du -sh "$DL_DIR" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.BOARD }}-build
          path: |
            build.log
            build-attempt*.log
          if-no-files-found: ignore
          include-hidden-files: true

      # 빌드가 실패하거나 시간 초과로 멈춰도 그때까지 쌓인 ccache 는 저장해 재실행 시간을 줄인다.
      - name: Trim and save ccache
        if: success() || failure()
        run: |
          # 시간 초과로 멈춘 스텝의 빌드 컨테이너가 남아 있으면 먼저 멈춘다.
          docker ps -q | xargs -r docker kill > /dev/null 2>&1 || true
          # ✅ FIX (diagnostic + safety):
          #   (1) 탐지된 CCACHE_DIR 와 실제 크기 출력
          #   (2) <1 MB 면 후보 경로들 검색해서 진짜 ccache 위치 찾기
          #   (3) 그래도 <1 MB 면 release 업로드 스킵해서 기존 캐시 보존
          #   왜: base 가 10 KB 만 올라가는 현상 — make vars 탐지 실패시
          #       빈 fallback 디렉토리를 묶어 release 의 정상 캐시를 덮어쓰던 문제.
          CCACHE_DIR=$(make vars 2>/dev/null | awk -F': +' '/ccache directory:/ {print $2}' | tr -d '[:space:]')
          [ -z "$CCACHE_DIR" ] && CCACHE_DIR="${PWD}/buildroot-ccache"
          echo "===== ccache 진단 ====="
          echo "탐지된 CCACHE_DIR: $CCACHE_DIR"
          SIZE_BYTES=0
          [ -d "$CCACHE_DIR" ] && SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "크기: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo '(없음)') ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "⚠️  1 MB 미만 — 다른 ccache 위치 후보 검색"
            for CAND in "${PWD}/buildroot-ccache" "$HOME/.buildroot-ccache" "$HOME/.ccache" \
                        "output/${BOARD}/host/.ccache" "output/${BOARD}/buildroot-ccache" \
                        "output/${BOARD}/build/buildroot-ccache" "/root/.buildroot-ccache" "/root/.ccache"; do
              if [ -d "$CAND" ]; then
                CSZ=$(du -sb "$CAND" 2>/dev/null | cut -f1 || echo 0)
                CSH=$(du -sh "$CAND" 2>/dev/null | cut -f1 || echo 0)
                echo "    [후보] $CAND : $CSH"
                # 더 큰 후보 발견하면 그걸로 교체
                if [ "$CSZ" -gt "$SIZE_BYTES" ]; then
                  CCACHE_DIR="$CAND"; SIZE_BYTES="$CSZ"
                fi
              fi
            done
            echo "    [find] ccache 관련 디렉토리들:"
            find "${PWD}" /root /home -maxdepth 4 -type d -name "*ccache*" 2>/dev/null | head -10 || true
            echo "    최종 채택: $CCACHE_DIR ($SIZE_BYTES bytes)"
          fi
          if [ -d "$CCACHE_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR" || true
            sudo chmod -R a+rwX "$CCACHE_DIR" || true
          fi
          if command -v ccache >/dev/null 2>&1 && [ -d "$CCACHE_DIR" ]; then
            echo "----- ccache -s -----"
            CCACHE_DIR="$CCACHE_DIR" ccache -s 2>/dev/null | head -20 || true
            echo "---------------------"
            CCACHE_DIR="$CCACHE_DIR" ccache -M "$CCACHE_MAX_BUILD" || true
            CCACHE_DIR="$CCACHE_DIR" ccache -c || true
            SIZE_BYTES=$(du -sb "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          fi
          # 안전장치: <1 MB 면 사실상 빈 캐시 → release 덮어쓰기 거부
          if [ "$SIZE_BYTES" -lt 1048576 ]; then
            echo "::warning::ccache <1 MB ($SIZE_BYTES bytes) — release 업로드 스킵, 기존 캐시 보존"
            exit 0
          fi
          PARENT="$(dirname "$CCACHE_DIR")"
          BASE="$(basename "$CCACHE_DIR")"
          tar -C "$PARENT" --remove-files -cf - "$BASE" \
            | split -b 1900m - ccache-${BOARD}-build.tar.part-
          echo "split 생성:"
          ls -la ccache-${BOARD}-build.tar.part-*
        continue-on-error: true

      - name: Save ccache (build)
        id: save-cache-build
        uses: ncipollo/release-action@v1.14.0
        if: ${{ !cancelled() && hashFiles(format('ccache-{0}-build.tar.part-*', inputs.BOARD)) != '' }}
        with:
          tag:          ccache
          # ✅ FIX: split 된 part 파일들을 한 번에 업로드 (와일드카드)
          artifacts:    "ccache-${{ inputs.BOARD }}-build.tar.part-*"
          allowUpdates: true
          makeLatest:   false
          prerelease:   true
          body:         ccache
          token:        ${{ secrets.CACHE_PAT || secrets.GITHUB_TOKEN }}
          owner:        ${{ github.repository_owner }}
          repo:         ${{ env.CACHE_REPO }}
        continue-on-error: true

      - name: Warn if ccache upload failed (build)
        if: ${{ !cancelled() && steps.save-cache-build.outcome == 'failure' }}
        run: |
          echo "::warning title=ccache 업로드 실패::cache repo($CACHE_REPO)에 build ccache 업로드 실패. 다음 빌드 속도에 영향. 확인사항: 1) ${{ github.repository_owner }}/$CACHE_REPO 레포 존재? 2) CACHE_PAT가 그 레포에 Contents:write 권한 있음?"

      # Makefile 의 collect-build-artifacts 가 output/<board>/images/knulli 를
      # target/<board>/ 로 옮기고 원본을 지우므로 target/ 에서 수집한다.
      - name: Generate image checksums
        run: |
          cd "target/${{ inputs.BOARD }}"
          ls -la
          for F in knulli-*.img.gz; do
            [ -f "$F" ] || continue
            sha256sum "$F" | cut -d' ' -f1 > "$F.sha256"
          done

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: knulli-image-${{ inputs.BOARD }}-${{ inputs.DATE }}
          path: |
            target/${{ inputs.BOARD }}/knulli-*.img.gz
            target/${{ inputs.BOARD }}/knulli-*.img.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days:    7

  # ═════════════════════════════════════════════════════════════════════════
  # Stage 6: cleanup (중간 아티팩트 삭제, 디스크/할당량 절약)
  # ═════════════════════════════════════════════════════════════════════════
  cleanup:
    name: ${{ inputs.BOARD }} · 6-cleanup
    needs: image
    # ✅ FIX: 이전엔 `always() && !cancelled()` 였는데, 이 경우 image 잡이
    #         실패해도 cleanup 이 무조건 돌아서 frontend-/heavy-libretro-/
    #         standalone- 등 중간 아티팩트를 전부 지워버림.
    #         그 결과 build.yml 의 rerun-failed 가 자동 재실행을 걸어도
    #         image 잡의 download-artifact 단계에서 "Artifact not found" 로
    #         계속 실패. 자동 재시도(run_attempt < 3) 가 무력화됨.
    #         → image 가 success 일 때만 정리한다. 실패 시엔 retention-days:1
    #         로 자동 만료되므로 디스크/할당량 영향도 미미.
    if: ${{ needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@v5
        continue-on-error: true
        with:
          name: |
            toolchain-${{ inputs.BOARD }}
            base-${{ inputs.BOARD }}
            frontend-${{ inputs.BOARD }}
            frontend-build-${{ inputs.BOARD }}
            heavy-libretro-${{ inputs.BOARD }}
            libretro-${{ inputs.BOARD }}
            standalone-${{ inputs.BOARD }}
            standalone-heavy-${{ inputs.BOARD }}
          failOnError: false
